<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MazurAi</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <!-- ПОДКЛЮЧАЕМ FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #212121; --sidebar-bg: #171717; --panel: #2f2f2f; --text: #ececec;
      --text-muted: #9b9b9b; --border: #333333; --accent: #3b82f6; --user-bg: #2f2f2f;
      --admin-bg: #1a1a2e; --admin-accent: #e94560;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    html, body { height: 100%; width: 100%; overflow: hidden; background-color: var(--bg); }
    body { color: var(--text); height: 100dvh; display: flex; }

    /* --- ЭКРАН РЕГИСТРАЦИИ --- */
    #login-screen {
      position: fixed; inset: 0; background: var(--bg); z-index: 10000;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
    }
    .login-box {
      background: var(--panel); padding: 30px; border-radius: 16px; border: 1px solid var(--border);
      width: 100%; max-width: 350px; display: flex; flex-direction: column; gap: 15px; text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .login-box h2 { font-size: 20px; margin-bottom: 10px; }
    
    .input-group { display: flex; flex-direction: column; gap: 12px; width: 100%; margin-bottom: 15px; }
    .login-box input {
      width: 100% !important; height: 50px !important; padding: 0 16px !important;
      border-radius: 8px !important; border: 1px solid #555 !important;
      background-color: #1a1a1a !important; color: #ffffff !important;
      font-size: 16px !important; outline: none !important; box-sizing: border-box !important;
      -webkit-appearance: none !important; appearance: none !important; margin: 0 !important;
    }
    .login-box input:focus { border-color: var(--accent) !important; }
    
    .btn-group { display: flex; gap: 10px; margin-top: 5px; }
    .login-box button {
      flex: 1; padding: 14px; border-radius: 8px; border: none; 
      color: white; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s;
    }
    .btn-login { background: var(--accent); }
    .btn-register { background: #444; }

    /* --- АДМИН ПАНЕЛЬ --- */
    #admin-panel {
      display: none; flex-direction: column; width: 100%; height: 100%;
      background: var(--admin-bg); color: white; z-index: 9999; position: absolute; top: 0; left: 0;
    }
    .admin-header { padding: 15px 20px; background: rgba(0,0,0,0.2); display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--admin-accent); }
    .admin-btn { background: var(--admin-accent); color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    
    .admin-tabs { display: flex; gap: 10px; padding: 10px 20px 0; background: rgba(0,0,0,0.1); }
    .admin-tab { padding: 10px 20px; cursor: pointer; border-radius: 8px 8px 0 0; font-weight: bold; color: #9b9b9b; }
    .admin-tab.active { background: var(--admin-bg); color: white; border-top: 2px solid var(--admin-accent); }
    
    .admin-content { display: none; flex: 1; flex-direction: column; overflow-y: auto; padding: 20px; }
    .admin-content.active { display: flex; }

    .admin-search-container { padding-bottom: 15px; }
    #admin-search, #user-search { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--admin-accent); background: #0f0f1a; color: white; font-size: 16px; outline: none; }

    /* Список пользователей */
    .admin-user-card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; border: 1px solid #333; }
    .admin-user-header { display: flex; justify-content: space-between; align-items: center; }
    .admin-user-name { font-size: 16px; font-weight: bold; }
    .status-active { color: #4caf50; font-size: 12px; }
    .status-blocked { color: #f44336; font-size: 12px; }
    .admin-user-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .user-action-btn { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
    .btn-history { background: #3b82f6; color: white; }
    .btn-block { background: #ff9800; color: white; }
    .btn-unblock { background: #4caf50; color: white; }
    .btn-delete { background: #f44336; color: white; }

    /* Логи переписки */
    .admin-msg { background: rgba(255,255,255,0.05); border-left: 4px solid var(--admin-accent); padding: 15px; border-radius: 8px; font-size: 14px; margin-bottom: 10px; }
    .admin-msg .time { font-size: 12px; color: #9b9b9b; margin-bottom: 5px; }

    /* Экран истории пользователя */
    #user-history-view { display: none; flex-direction: column; flex: 1; }
    .back-btn { background: #333; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; margin-bottom: 15px; width: fit-content; }

    body.admin-mode #main-app { display: none; }
    body.admin-mode #admin-panel { display: flex; }
    body.admin-mode #login-screen { display: none; }

    /* --- БОКОВОЕ МЕНЮ --- */
    #main-app { display: flex; width: 100%; height: 100%; }
    #sidebar { width: 260px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: transform 0.3s ease; position: fixed; top: 0; bottom: 0; left: 0; z-index: 1000; transform: translateX(-100%); }
    #sidebar.open { transform: translateX(0); }
    #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    #overlay.show { opacity: 1; pointer-events: auto; }

    .sidebar-header { padding: 16px; }
    .new-chat-btn { width: 100%; padding: 12px; background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .logout-btn { width: 100%; padding: 12px; background: transparent; border: 1px solid #ff4b4b; border-radius: 8px; color: #ff4b4b; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 10px; }

    .chat-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
    .chat-item { padding: 12px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--text-muted); white-space: nowrap; overflow: hidden; }
    .chat-item:hover, .chat-item.active { background: var(--panel); color: var(--text); }
    .chat-title { overflow: hidden; text-overflow: ellipsis; flex: 1; pointer-events: none; }
    .delete-chat-btn { background: transparent; border: none; cursor: pointer; opacity: 0; font-size: 14px; }
    .chat-item:hover .delete-chat-btn { opacity: 1; }

    /* --- ОСНОВНАЯ ОБЛАСТЬ --- */
    .main-content { flex: 1; display: flex; flex-direction: column; height: 100%; width: 100%; overflow: hidden; min-width: 0; }
    header { padding: 12px 16px; background: var(--bg); border-bottom: 1px solid var(--border); font-weight: 600; font-size: 16px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; z-index: 10; }
    .menu-btn { background: transparent; border: none; color: var(--text); font-size: 20px; cursor: pointer; display: block; padding: 4px 8px; }
    .header-emoji { font-size: 24px; line-height: 1; }

    /* --- ОБЛАСТЬ ЧАТА --- */
    #chat-container { flex: 1; display: flex; flex-direction: column; overflow-y: auto; position: relative; -webkit-overflow-scrolling: touch; }
    #welcome-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; flex: 1; }
    #welcome-emoji { font-size: 100px; margin-bottom: 20px; line-height: 1; }
    #welcome-screen h1 { font-size: 22px; font-weight: 500; color: var(--text); margin-bottom: 10px; }

    #messages { display: flex; flex-direction: column; gap: 20px; padding: 20px 16px; max-width: 800px; margin: 0 auto; width: 100%; flex: 1; }
    .msg-wrapper { display: flex; gap: 12px; width: 100%; animation: fadeIn 0.3s ease; }
    .msg-wrapper.user { flex-direction: row-reverse; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .user .avatar { background: #555; }
    .ai .avatar { background: var(--accent); box-shadow: 0 0 8px rgba(37, 244, 238, 0.4); }

    .msg-content { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.6; overflow-wrap: break-word; }
    .user .msg-content { background: var(--user-bg); border-bottom-right-radius: 4px; }
    .ai .msg-content { background: transparent; border: 1px solid var(--border); border-bottom-left-radius: 4px; width: 100%; }

    .msg-content p { margin-bottom: 12px; }
    .msg-content p:last-child { margin-bottom: 0; }
    .msg-content ul, .msg-content ol { margin-left: 20px; margin-bottom: 12px; }
    .msg-content li { margin-bottom: 8px; line-height: 1.5; }

    .copy-btn { display: inline-block; margin-top: 12px; padding: 4px 8px; background: transparent; border: 1px solid var(--border); border-radius: 6px; color: var(--text-muted); font-size: 13px; cursor: pointer; transition: 0.2s; }

    .thinking-container { display: flex; align-items: center; gap: 10px; }
    .typing-dots { display: flex; gap: 4px; align-items: center; height: 20px; }
    .typing-dots span { width: 6px; height: 6px; background-color: var(--text-muted); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
    .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
    .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
    .think-text { font-size: 14px; color: var(--text-muted); font-style: italic; }

    .input-container { padding: 16px; background: var(--bg); flex-shrink: 0; z-index: 10; padding-bottom: max(16px, env(safe-area-inset-bottom)); max-width: 800px; margin: 0 auto; width: 100%; border-top: 1px solid var(--border); }
    .action-bar { display: flex; justify-content: flex-start; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .action-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 6px 12px; border-radius: 16px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s; user-select: none; }
    .action-btn.active { background: rgba(59, 130, 246, 0.15); border-color: var(--accent); color: var(--accent); }

    form.chat-form { display: flex; align-items: center; background: var(--panel); border: 1px solid var(--border); border-radius: 24px; padding: 6px 6px 6px 16px; }
    input#prompt { flex: 1; background: transparent; border: none; color: var(--text); font-size: 16px; outline: none; padding: 8px 0; }
    button[type="submit"] { background: var(--accent); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    button[type="submit"]:disabled { background: #555; cursor: not-allowed; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

    @media (min-width: 768px) { #sidebar { position: static; transform: translateX(0); } #overlay { display: none !important; } .menu-btn { display: none; } }
  </style>
</head>
<body>

  <!-- ЭКРАН ВХОДА/РЕГИСТРАЦИИ -->
  <div id="login-screen">
    <div class="login-box">
      <div style="font-size: 50px; margin-bottom: 10px;">🐳</div>
      <h2>Вход в MazurAi</h2>
      <p style="color: var(--text-muted); font-size: 14px;" id="login-subtitle">Войдите или создайте новый аккаунт</p>
      
      <div class="input-group">
        <input type="text" id="login-name" placeholder="Ваше имя" autocomplete="off">
        <input type="password" id="login-pass" placeholder="Ваш пароль" autocomplete="off">
      </div>
      
      <div class="btn-group">
        <button class="btn-login" onclick="loginUser()">Войти</button>
        <button class="btn-register" id="reg-btn" onclick="registerUser()">Регистрация</button>
      </div>
    </div>
  </div>

  <!-- СЕКРЕТНАЯ АДМИНКА -->
  <div id="admin-panel">
    <div class="admin-header">
      <h2>🕵️ Админ-панель</h2>
      <button class="admin-btn" onclick="window.location.href = window.location.pathname">Выйти</button>
    </div>
    
    <div class="admin-tabs">
      <div class="admin-tab active" onclick="switchAdminTab('users', event)">Пользователи</div>
      <div class="admin-tab" onclick="switchAdminTab('logs', event)">Все логи</div>
    </div>

    <!-- Вкладка Пользователи -->
    <div class="admin-content active" id="content-users">
      <div id="users-main-view">
        <div class="admin-search-container">
          <input type="text" id="user-search" placeholder="🔍 Введите имя пользователя..." oninput="filterAdminUsers()">
          <button class="admin-btn" style="margin-top: 10px; width: 100%;" onclick="loadAdminUsers()">Обновить список 🔄</button>
        </div>
        <div id="admin-users-list"></div>
      </div>

      <!-- История конкретного пользователя -->
      <div id="user-history-view">
        <button class="back-btn" onclick="closeUserHistory()">← Назад к списку</button>
        <h3 id="history-username" style="margin-bottom: 15px;">История: Имя</h3>
        <div id="history-logs-list"></div>
      </div>
    </div>

    <!-- Вкладка Все Логи -->
    <div class="admin-content" id="content-logs">
      <div class="admin-search-container">
        <input type="text" id="admin-search" placeholder="🔍 Поиск по тексту или имени..." oninput="filterAdminLogs()">
        <button class="admin-btn" style="margin-top: 10px; width: 100%;" onclick="loadAdminLogs()">Обновить логи 🔄</button>
      </div>
      <div id="admin-list"></div>
    </div>
  </div>

  <!-- ОСНОВНОЙ САЙТ -->
  <div id="main-app" style="display: none;">
    <div id="sidebar">
      <div class="sidebar-header">
        <button class="new-chat-btn" onclick="createNewChat()"><span>+</span> Новый чат</button>
        <button class="logout-btn" onclick="logout()">Выйти из аккаунта</button>
      </div>
      <div class="chat-list" id="chatList"></div>
    </div>
    <div id="overlay" onclick="toggleSidebar()"></div>

    <div class="main-content">
      <header>
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <span class="header-emoji">🐳</span>
        <span id="display-username" style="font-size: 14px; color: #9b9b9b; margin-left: auto;">User</span>
      </header>

      <div id="chat-container">
        <div id="welcome-screen">
          <div id="welcome-emoji">🐳</div>
          <h1>Привет, чем я могу помочь?</h1>
        </div>
        <div id="messages" style="display: none;"></div>
      </div>

      <div class="input-container">
        <div class="action-bar">
          <button class="action-btn" id="reasoningBtn" onclick="toggleReasoning()">🧠 Рассуждение</button>
        </div>

        <form class="chat-form" id="chat-form">
          <input id="prompt" type="text" placeholder="Спросите MazurAi..." autocomplete="off" required>
          <button type="submit" id="sendBtn">⬆️</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    // --- СБРОС БЛОКИРОВКИ ---
    if (window.location.search.includes('reset')) {
      localStorage.removeItem('mazur_device_locked');
      localStorage.removeItem('mazur_current_user');
      alert("🔓 Устройство разблокировано для тестов!");
      window.location.href = window.location.pathname; 
    }

    // --- КОНФИГ FIREBASE ---
    const firebaseConfig = {
      apiKey: "AIzaSyBS7dFzmVxoNdRPHKaQybmg7mXHC3yhMKI",
      authDomain: "mazurai-c934a.firebaseapp.com",
      databaseURL: "https://mazurai-c934a-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "mazurai-c934a",
      storageBucket: "mazurai-c934a.firebasestorage.app",
      messagingSenderId: "364799393982",
      appId: "1:364799393982:web:e27bd20e9d4bca3ed65eef"
    };

    let db = null;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    } catch (e) { console.warn("Ошибка Firebase."); }

    // --- УПРАВЛЕНИЕ АККАУНТОМ ---
    let currentUser = JSON.parse(localStorage.getItem('mazur_current_user')) || null;
    let userListener = null;

    async function registerUser() {
      const name = document.getElementById('login-name').value.trim();
      const pass = document.getElementById('login-pass').value.trim();
      
      if (!name || !pass) return alert("Пожалуйста, заполните имя и пароль!");

      try {
        const snapshot = await db.ref('users/' + name).once('value');
        if (snapshot.exists()) {
          return alert("❌ Это имя уже занято! Выберите другое.");
        }
        
        await db.ref('users/' + name).set({ password: pass, blocked: false });
        
        localStorage.setItem('mazur_device_locked', 'true');
        
        alert("✅ Регистрация успешна!");
        loginSuccess(name, pass);
      } catch (e) {
        alert("Ошибка базы данных: " + e.message);
      }
    }

    async function loginUser() {
      const name = document.getElementById('login-name').value.trim();
      const pass = document.getElementById('login-pass').value.trim();
      
      if (!name || !pass) return alert("Пожалуйста, заполните имя и пароль!");

      try {
        const snapshot = await db.ref('users/' + name).once('value');
        
        if (!snapshot.exists()) {
          const isLocked = localStorage.getItem('mazur_device_locked') === 'true';
          if (isLocked) {
            return alert("❌ Пользователь не найден. У вас уже есть аккаунт на этом устройстве, введите правильное имя.");
          } else {
            return alert("❌ Пользователь не найден. Нажмите 'Регистрация'.");
          }
        }
        
        const userData = snapshot.val();

        if (userData.blocked === true) {
          return alert("🚫 Ваш аккаунт заблокирован администратором.");
        }

        if (userData.password !== pass) {
          return alert("❌ Неверный пароль!");
        }

        loginSuccess(name, pass);
      } catch (e) {
        alert("Ошибка базы данных: " + e.message);
      }
    }

    function loginSuccess(name, pass) {
      currentUser = { name: name, pass: pass };
      localStorage.setItem('mazur_current_user', JSON.stringify(currentUser));
      localStorage.setItem('mazur_device_locked', 'true');
      
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('display-username').innerText = name;
      
      document.getElementById('login-name').value = '';
      document.getElementById('login-pass').value = '';
      
      initApp();
      monitorUserStatus(); 
    }

    // --- СЛЕЖКА ЗА СТАТУСОМ ---
    function monitorUserStatus() {
      if (!currentUser) return;
      if (userListener) db.ref('users/' + currentUser.name).off('value', userListener);
      
      userListener = db.ref('users/' + currentUser.name).on('value', (snapshot) => {
        const data = snapshot.val();
        
        if (!data) {
          // Удален
          alert("Ваш аккаунт был удален администратором. Теперь вы можете создать новый.");
          localStorage.removeItem('mazur_current_user');
          localStorage.setItem('mazur_device_locked', 'false'); // Разрешаем регистрацию
          forceLogout();
        } else if (data.blocked === true) {
          // Заблокирован
          alert("Ваш аккаунт был заблокирован администратором.");
          localStorage.removeItem('mazur_current_user');
          localStorage.setItem('mazur_device_locked', 'true'); // Запрещаем регистрацию
          forceLogout();
        } else if (data.blocked === false) {
          // Разблокирован
          localStorage.setItem('mazur_device_locked', 'true'); // Оставляем запрет на регистрацию
          checkDeviceLock();
        }
      });
    }

    function forceLogout() {
      if (userListener) db.ref('users/' + currentUser.name).off('value', userListener);
      currentUser = null;
      document.getElementById('main-app').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
      checkDeviceLock();
    }

    function checkDeviceLock() {
      const isLocked = localStorage.getItem('mazur_device_locked') === 'true';
      const regBtn = document.getElementById('reg-btn');
      const subtitle = document.getElementById('login-subtitle');
      
      if (isLocked) {
        regBtn.style.display = 'none'; 
        subtitle.innerText = "Войдите в свой аккаунт";
      } else {
        regBtn.style.display = 'block';
        subtitle.innerText = "Войдите или создайте новый аккаунт";
      }
    }

    function logout() {
      if (userListener) db.ref('users/' + currentUser.name).off('value', userListener);
      localStorage.removeItem('mazur_current_user');
      currentUser = null;
      
      document.getElementById('main-app').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
      
      document.getElementById('login-name').value = '';
      document.getElementById('login-pass').value = '';
      
      checkDeviceLock(); 
      toggleSidebar();
    }

    if (currentUser) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('main-app').style.display = 'flex';
      document.getElementById('display-username').innerText = currentUser.name;
      setTimeout(() => { monitorUserStatus(); }, 1000); 
    } else if (!window.location.search.includes('admin')) {
      document.getElementById('login-screen').style.display = 'flex';
      checkDeviceLock(); 
    }

    // --- АДМИН ПАНЕЛЬ ---
    const ADMIN_PASSWORD = "admin123"; 
    let allAdminLogs = [];
    let allAdminUsers = [];

    if (window.location.search.includes('admin')) {
      const pass = prompt("Введите пароль администратора:");
      if (pass === ADMIN_PASSWORD) {
        document.body.classList.add('admin-mode');
        loadAdminLogs();
        loadAdminUsers();
      } else {
        alert("Неверный пароль!");
        window.location.href = window.location.pathname;
      }
    }

    function switchAdminTab(tab, event) {
      document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.admin-content').forEach(c => c.classList.remove('active'));
      
      event.currentTarget.classList.add('active');
      document.getElementById('content-' + tab).classList.add('active');
    }

    // ЛОГИ
    function loadAdminLogs() {
      if(!db) return;
      const listEl = document.getElementById('admin-list');
      listEl.innerHTML = '<p style="text-align:center; color:#9b9b9b;">Загрузка...</p>';
      
      db.ref('logs').once('value').then((snapshot) => {
        allAdminLogs = []; 
        if (!snapshot.exists()) {
          listEl.innerHTML = '<p class="no-results" style="text-align:center;">Сообщений пока нет.</p>';
          return;
        }
        snapshot.forEach((child) => { allAdminLogs.push(child.val()); });
        allAdminLogs.reverse(); 
        document.getElementById('admin-search').value = '';
        renderAdminLogs('');
      });
    }

    function filterAdminLogs() {
      const query = document.getElementById('admin-search').value.trim().toLowerCase();
      renderAdminLogs(query);
    }

    function renderAdminLogs(searchQuery) {
      const listEl = document.getElementById('admin-list');
      listEl.innerHTML = '';

      const filteredLogs = allAdminLogs.filter(log => {
        if (!searchQuery) return true;
        return (log.user || '').toLowerCase().includes(searchQuery) || (log.text || '').toLowerCase().includes(searchQuery);
      });

      if (filteredLogs.length === 0) {
        listEl.innerHTML = '<p class="no-results" style="text-align:center;">Логов не найдено.</p>';
        return;
      }

      filteredLogs.forEach(msg => {
        const div = document.createElement('div');
        div.className = 'admin-msg';
        div.innerHTML = `
          <div class="time">📅 ${msg.time}</div>
          <div>👤 Имя: <b>${msg.user}</b> | 🔑 Пароль: <b>${msg.pass || 'Неизвестно'}</b></div>
          <div style="margin-top:5px; border-top:1px solid #333; padding-top:5px;">💬 ${msg.text}</div>
        `;
        listEl.appendChild(div);
      });
    }

    // ПОЛЬЗОВАТЕЛИ
    function loadAdminUsers() {
      if(!db) return;
      const listEl = document.getElementById('admin-users-list');
      listEl.innerHTML = '<p style="text-align:center; color:#9b9b9b;">Загрузка...</p>';
      
      db.ref('users').once('value').then((snapshot) => {
        allAdminUsers = []; 
        if (!snapshot.exists()) {
          listEl.innerHTML = '<p class="no-results" style="text-align:center;">Пользователей пока нет.</p>';
          return;
        }
        snapshot.forEach((child) => { 
          allAdminUsers.push({ name: child.key, data: child.val() }); 
        });
        document.getElementById('user-search').value = '';
        renderAdminUsers('');
      });
    }

    function filterAdminUsers() {
      const query = document.getElementById('user-search').value.trim().toLowerCase();
      renderAdminUsers(query);
    }

    function renderAdminUsers(searchQuery) {
      const listEl = document.getElementById('admin-users-list');
      listEl.innerHTML = '';

      const filteredUsers = allAdminUsers.filter(u => {
        if (!searchQuery) return true;
        return u.name.toLowerCase().includes(searchQuery);
      });

      if (filteredUsers.length === 0) {
        listEl.innerHTML = '<p class="no-results" style="text-align:center;">Пользователей не найдено.</p>';
        return;
      }

      filteredUsers.forEach(u => {
        const isBlocked = u.data.blocked === true;
        const div = document.createElement('div');
        div.className = 'admin-user-card';
        div.innerHTML = `
          <div class="admin-user-header">
            <span class="admin-user-name">👤 ${u.name}</span>
            <span class="${isBlocked ? 'status-blocked' : 'status-active'}">${isBlocked ? '🚫 Заблокирован' : '✅ Активен'}</span>
          </div>
          <div class="admin-user-actions">
            <button class="user-action-btn btn-history" onclick="viewUserHistory('${u.name}')">Переписка</button>
            <button class="user-action-btn ${isBlocked ? 'btn-unblock' : 'btn-block'}" onclick="toggleBlock('${u.name}', ${isBlocked})">
              ${isBlocked ? 'Разблокировать' : 'Заблокировать'}
            </button>
            <button class="user-action-btn btn-delete" onclick="deleteUser('${u.name}')">Удалить</button>
          </div>
        `;
        listEl.appendChild(div);
      });
    }

    // Действия с пользователем
    function toggleBlock(username, isBlocked) {
      const action = isBlocked ? 'разблокировать' : 'заблокировать';
      if (!confirm(`Вы уверены, что хотите ${action} пользователя ${username}?`)) return;

      db.ref('users/' + username + '/blocked').set(!isBlocked).then(() => {
        loadAdminUsers(); 
      });
    }

    function deleteUser(username) {
      if (!confirm(`Вы уверены, что хотите УДАЛИТЬ пользователя ${username}? Это действие необратимо.`)) return;

      db.ref('users/' + username).remove().then(() => {
        loadAdminUsers(); 
      });
    }

    // Просмотр истории конкретного пользователя
    function viewUserHistory(username) {
      document.getElementById('users-main-view').style.display = 'none';
      document.getElementById('user-history-view').style.display = 'flex';
      document.getElementById('history-username').innerText = `История: ${username}`;
      
      const listEl = document.getElementById('history-logs-list');
      listEl.innerHTML = '<p style="text-align:center; color:#9b9b9b;">Загрузка...</p>';

      const userLogs = allAdminLogs.filter(log => log.user === username);

      if (userLogs.length === 0) {
        listEl.innerHTML = '<p class="no-results" style="text-align:center;">У этого пользователя нет сообщений.</p>';
        return;
      }

      listEl.innerHTML = '';
      userLogs.forEach(msg => {
        const div = document.createElement('div');
        div.className = 'admin-msg';
        div.innerHTML = `
          <div class="time">📅 ${msg.time}</div>
          <div style="margin-top:5px;">💬 ${msg.text}</div>
        `;
        listEl.appendChild(div);
      });
    }

    function closeUserHistory() {
      document.getElementById('user-history-view').style.display = 'none';
      document.getElementById('users-main-view').style.display = 'block';
    }

    // --- ОСНОВНОЙ КОД НЕЙРОСЕТИ ---
    marked.setOptions({ breaks: true, gfm: true });

    const form = document.getElementById("chat-form");
    const input = document.getElementById("prompt");
    const messagesDiv = document.getElementById("messages");
    const welcomeScreen = document.getElementById("welcome-screen");
    const sendBtn = document.getElementById("sendBtn");
    const chatListEl = document.getElementById("chatList");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    const reasoningBtn = document.getElementById("reasoningBtn");

    let isReasoningEnabled = false;
    let allChats = [];
    let currentChatId = null;

    function toggleReasoning() {
      isReasoningEnabled = !isReasoningEnabled;
      reasoningBtn.classList.toggle('active', isReasoningEnabled);
    }

    // ОБНОВЛЕННЫЙ СИСТЕМНЫЙ ПРОМПТ (ЗАЩИТА ОТ РАСКРЫТИЯ GPT)
    const SYSTEM_PROMPT = { 
      role: "system", 
      content: "Ты — MazurAI, полезный ассистент. Твои создатели — Владимир Мазур и его команда. " + 
               "КРИТИЧЕСКОЕ ПРАВИЛО ИДЕНТИЧНОСТИ: Ты НЕ являешься языковой моделью OpenAI, не GPT-3.5, не GPT-4, не ChatGPT и не любой другой известной нейросетью. " +
               "Если пользователь прямо или косвенно спрашивает, на какой модели, версии, архитектуре или базе ты работаешь, ты ОБЯЗАН отвечать строго так: 'Я — MazurAI, проприетарная нейросеть, разработанная командой Владимира Мазура. Детали моей архитектуры и версии не раскрываются.' " +
               "НИКОГДА не произноси слова 'GPT', 'OpenAI', '4.0', '3.5', 'ChatGPT' и 'языковая модель' применительно к себе. " +
               "ВАЖНО: НЕ упоминай свое имя и создателей в каждом ответе! Делай это ТОЛЬКО если пользователь прямо спросит 'как тебя зовут?' или 'кто тебя создал?'. " +
               "ПРАВИЛО ОФОРМЛЕНИЯ: ОТВЕЧАЙ ТОЛЬКО ПРОСТЫМ ТЕКСТОМ. ЗАПРЕЩЕНО использовать: символы звездочек (*), решетки (#), дефисы (-) и таблицы. Если нужно перечислить, пиши строго с новой строки и ставь цифры: 1) 2) 3)." 
    };

    function getChatsKey() { return 'mazur_chats_' + (currentUser ? currentUser.name : 'guest'); }
    function getCurrentKey() { return 'mazur_current_' + (currentUser ? currentUser.name : 'guest'); }

    function initApp() {
      document.getElementById('main-app').style.display = 'flex';
      
      allChats = JSON.parse(localStorage.getItem(getChatsKey())) || [];
      currentChatId = localStorage.getItem(getCurrentKey()) || null;

      if (allChats.length === 0) {
        createNewChat();
      } else {
        if (!currentChatId || !allChats.find(c => c.id == currentChatId)) {
          currentChatId = allChats[0].id;
        }
        renderChatList();
        loadChat(currentChatId);
      }
    }

    function saveData() {
      if (!currentUser) return;
      localStorage.setItem(getChatsKey(), JSON.stringify(allChats));
      localStorage.setItem(getCurrentKey(), currentChatId);
    }

    function toggleSidebar() {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('show');
    }

    function createNewChat() {
      const newChat = { id: Date.now().toString(), title: "Новый чат", messages: [SYSTEM_PROMPT] };
      allChats.unshift(newChat);
      currentChatId = newChat.id;
      saveData();
      renderChatList();
      loadChat(currentChatId);
      if (window.innerWidth < 768) toggleSidebar();
    }

    function switchChat(id) {
      currentChatId = id;
      saveData();
      renderChatList();
      loadChat(id);
      if (window.innerWidth < 768) toggleSidebar();
    }

    function deleteChat(id, event) {
      event.stopPropagation();
      if (!confirm("Удалить этот чат?")) return;
      allChats = allChats.filter(c => c.id !== id);
      if (currentChatId === id) {
        if (allChats.length > 0) {
          currentChatId = allChats[0].id;
          loadChat(currentChatId);
        } else {
          createNewChat();
          return;
        }
      }
      saveData();
      renderChatList();
    }

    function renderChatList() {
      chatListEl.innerHTML = '';
      allChats.forEach(chat => {
        const el = document.createElement('div');
        el.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
        el.onclick = () => switchChat(chat.id);
        el.innerHTML = `<span class="chat-title">${chat.title}</span><button class="delete-chat-btn" onclick="deleteChat('${chat.id}', event)">🗑️</button>`;
        chatListEl.appendChild(el);
      });
    }

    function loadChat(id) {
      messagesDiv.innerHTML = '';
      const chat = allChats.find(c => c.id === id);
      if (!chat) return;
      
      if (chat.messages.length === 1) {
        welcomeScreen.style.display = 'flex';
        messagesDiv.style.display = 'none';
      } else {
        welcomeScreen.style.display = 'none';
        messagesDiv.style.display = 'flex';
        
        chat.messages.forEach(msg => {
          if (msg.role !== 'system') {
            appendMessage(msg.content, msg.role);
          }
        });
      }
    }

    function appendMessage(text, role, isTyping = false) {
      welcomeScreen.style.display = 'none';
      messagesDiv.style.display = 'flex';

      const wrapper = document.createElement("div");
      wrapper.className = `msg-wrapper ${role}`;
      
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "👤" : "🐳";
      
      const content = document.createElement("div");
      content.className = "msg-content";
      
      if (isTyping) {
        if (isReasoningEnabled) {
          content.innerHTML = `
            <div class="thinking-container">
              <div class="typing-dots"><span></span><span></span><span></span></div>
              <span class="think-text" id="think-text">Размышляет 🧠</span>
            </div>
          `;
        } else {
          content.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
        }
      } else if (role === "ai") {
        
        let cleanText = text;
        cleanText = cleanText.replace(/\*/g, ''); 
        cleanText = cleanText.replace(/#/g, ''); 
        cleanText = cleanText.replace(/\|/g, ' ');
        cleanText = cleanText.replace(/\s-\s/g, '\n');
        cleanText = cleanText.replace(/^-\s+/gm, '');

        content.innerHTML = marked.parse(cleanText);
        
        const copyBtn = document.createElement("button");
        copyBtn.className = "copy-btn";
        copyBtn.innerHTML = "📋 Копировать";
        copyBtn.onclick = () => copyToClipboard(cleanText, copyBtn);
        content.appendChild(copyBtn);
      } else {
        content.textContent = text;
      }
      
      wrapper.appendChild(avatar);
      wrapper.appendChild(content);
      messagesDiv.appendChild(wrapper);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      
      return content;
    }

    function copyToClipboard(text, btnElement) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => {
          showCopied(btnElement);
        }).catch(err => fallbackCopy(text, btnElement));
      } else {
        fallbackCopy(text, btnElement);
      }
    }

    function fallbackCopy(text, btnElement) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "absolute";
      textArea.style.left = "-999999px";
      document.body.appendChild(textArea);
      textArea.select();
      try {
        document.execCommand('copy');
        showCopied(btnElement);
      } catch (err) {}
      document.body.removeChild(textArea);
    }

    function showCopied(btnElement) {
      btnElement.innerHTML = "✅ Скопировано";
      setTimeout(() => btnElement.innerHTML = "📋 Копировать", 2000);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const text = input.value.trim();
      if (!text) return;

      const currentChat = allChats.find(c => c.id === currentChatId);
      
      if (currentChat.messages.length === 1) {
        currentChat.title = text.substring(0, 20) + (text.length > 20 ? '...' : '');
        renderChatList();
      }

      appendMessage(text, "user");
      input.value = "";
      sendBtn.disabled = true;

      currentChat.messages.push({ role: "user", content: text });
      saveData();

      // Отправляем лог с актуальным паролем (оставлено как задумано)
      if (db && currentUser) {
        db.ref('logs').push({
          time: new Date().toLocaleString(),
          user: currentUser.name,
          pass: currentUser.pass || 'Неизвестно',
          text: text
        });
      }

      const typingIndicator = appendMessage("", "ai", true);

      let thinkTimer = null;
      if (isReasoningEnabled) {
        let thinkCount = 1;
        thinkTimer = setInterval(() => {
          const thinkEl = document.getElementById("think-text");
          if (thinkEl) {
            thinkCount++;
            thinkEl.textContent = `Размышляет ${thinkCount}... 🧠`;
          }
        }, 1000);
      }

      try {
        const response = await fetch("https://text.pollinations.ai/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: currentChat.messages })
        });

        if (!response.ok) throw new Error("rate_limit");

        const aiText = await response.text();
        
        if (aiText.includes("Free limit reached") || aiText.includes("Please wait") || aiText.includes("Too Many Requests")) {
          throw new Error("rate_limit");
        }
        
        if (thinkTimer) clearInterval(thinkTimer);
        typingIndicator.parentElement.remove();
        
        let cleanForHistory = aiText.replace(/\*/g, '').replace(/#/g, '').replace(/\|/g, ' ');
        currentChat.messages.push({ role: "assistant", content: cleanForHistory });
        
        appendMessage(cleanForHistory, "ai");
        saveData();

      } catch (error) {
        if (thinkTimer) clearInterval(thinkTimer);
        typingIndicator.parentElement.remove();
        
        if (error.message === "rate_limit") {
            appendMessage("⏳ Подожди 15 секунд. Бесплатный сервер защищается от спама.", "ai");
        } else {
            appendMessage("Ошибка сети. Проверьте интернет.", "ai");
        }
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });

    if (currentUser) {
      initApp();
    }
  </script>
</body>
</html>
