<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mazur.ai</title>
<style>
  :root {
    --bg: #212121; --sidebar-bg: #171717; --panel: #2f2f2f; --accent: #3b82f6;
    --text: #ececec; --text-muted: #9b9b9b; --border: #333333; --user-bg: #2f2f2f;
    --ai-bg: transparent; --disabled: #4a4a4a; --hover: #2a2a2a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; overflow: hidden; position: fixed; width: 100%; }
  
  /* --- Сайдбар --- */
  #sidebar {
    width: 260px; background: var(--sidebar-bg); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; transition: transform 0.3s ease;
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 1000; transform: translateX(-100%);
  }
  #sidebar.open { transform: translateX(0); }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
  #overlay.show { opacity: 1; pointer-events: auto; }

  .sidebar-header { padding: 16px; }
  .new-chat-btn { width: 100%; padding: 12px; background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
  .new-chat-btn:hover { background: var(--hover); }

  .chat-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
  .chat-item { padding: 12px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--text-muted); transition: 0.2s; white-space: nowrap; overflow: hidden; }
  .chat-item:hover, .chat-item.active { background: var(--hover); color: var(--text); }
  .chat-title { overflow: hidden; text-overflow: ellipsis; flex: 1; pointer-events: none; }
  .delete-chat-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; opacity: 0; padding: 4px; font-size: 14px; }
  .chat-item:hover .delete-chat-btn { opacity: 1; }
  .delete-chat-btn:hover { color: #ff6b6b; }

  /* --- Основная область --- */
  .main-content { flex: 1; display: flex; flex-direction: column; height: 100%; width: 100%; overflow: hidden; }
  header { padding: 12px 16px; background: var(--bg); border-bottom: 1px solid var(--border); font-weight: 600; font-size: 16px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; }
  .menu-btn { background: transparent; border: none; color: var(--text); font-size: 20px; cursor: pointer; padding: 4px 8px; border-radius: 8px; }
  
  #chat { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 24px; -webkit-overflow-scrolling: touch; max-width: 800px; margin: 0 auto; width: 100%; }
  
  /* Сообщения */
  .msg-wrapper { display: flex; gap: 16px; width: 100%; animation: fadeIn 0.3s ease; }
  .msg-wrapper.user { flex-direction: row-reverse; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .user .avatar { background: #555; color: #fff; }
  .ai .avatar { background: var(--accent); color: #fff; }
  .msg-content { max-width: calc(100% - 60px); padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.5; word-wrap: break-word; }
  .user .msg-content { background: var(--user-bg); border-bottom-right-radius: 4px; }
  .ai .msg-content { background: var(--ai-bg); border-bottom-left-radius: 4px; width: 100%; }

  .msg-image { max-width: 100%; border-radius: 8px; margin-bottom: 8px; display: block; }

  /* Блок рассуждений */
  .thought-block { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; overflow: hidden; font-size: 14px; }
  .thought-header { padding: 10px 12px; background: rgba(255,255,255,0.02); cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: var(--text-muted); user-select: none; }
  .thought-content { padding: 0 12px; max-height: 0; overflow: hidden; transition: all 0.3s ease; color: var(--text-muted); font-style: italic; white-space: pre-wrap; }
  .thought-content.show { max-height: 1000px; padding: 12px; border-top: 1px solid var(--border); }

  .typing-dots { display: flex; gap: 4px; align-items: center; height: 20px; }
  .typing-dots span { width: 6px; height: 6px; background-color: var(--text-muted); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
  .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
  .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

  /* Панель ввода */
  .input-container { padding: 0 16px 16px; background: var(--bg); flex-shrink: 0; padding-bottom: max(16px, env(safe-area-inset-bottom)); max-width: 800px; margin: 0 auto; width: 100%; }
  .action-bar { display: flex; justify-content: flex-start; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  
  /* Кнопки */
  .action-btn { 
    background: transparent; border: 1px solid var(--border); color: var(--text-muted); 
    padding: 6px 12px; border-radius: 16px; font-size: 13px; cursor: pointer; 
    display: flex; align-items: center; gap: 6px; transition: all 0.2s; 
    user-select: none;
  }
  .action-btn:hover { background: var(--hover); }
  .action-btn.active { background: rgba(59, 130, 246, 0.15); border-color: var(--accent); color: var(--accent); }

  .input-box { display: flex; align-items: center; background: var(--panel); border: 1px solid var(--border); border-radius: 24px; padding: 6px 6px 6px 16px; transition: border-color 0.2s; }
  .input-box:focus-within { border-color: #555; }
  input[type="text"] { flex: 1; background: transparent; border: none; color: var(--text); font-size: 16px; outline: none; padding: 8px 0; }
  input[type="text"]:disabled { opacity: 0.5; }
  
  .send-btn { background: var(--accent); color: white; width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: all 0.2s ease; flex-shrink: 0; }
  .send-btn:disabled { background: var(--disabled); cursor: not-allowed; opacity: 0.7; }

  #imagePreviewContainer { display: none; padding: 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; position: relative; width: fit-content; }
  #imagePreview { max-height: 100px; border-radius: 8px; display: block; }
  .cancel-image-btn { position: absolute; top: -8px; right: -8px; background: #ff6b6b; color: white; border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

  @media (min-width: 768px) { #sidebar { position: static; transform: translateX(0); } #overlay { display: none !important; } .menu-btn { display: none; } }
</style>
</head>
<body>

<div id="sidebar">
  <div class="sidebar-header">
    <button class="new-chat-btn" onclick="createNewChat()"><span>+</span> Новый чат</button>
  </div>
  <div class="chat-list" id="chatList"></div>
</div>
<div id="overlay" onclick="toggleSidebar()"></div>

<div class="main-content">
  <header>
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <div class="header-title"><span>🤖</span> Mazur.ai</div>
  </header>

  <div id="chat"></div>

  <div class="input-container">
    <div id="imagePreviewContainer">
      <img id="imagePreview" src="" alt="Preview">
      <button class="cancel-image-btn" onclick="clearImage()">✕</button>
    </div>

    <div class="action-bar">
      <button class="action-btn" id="reasoningBtn" onclick="toggleReasoning()">🧩 Рассуждение</button>
      <button class="action-btn" id="attachBtn" onclick="document.getElementById('imageInput').click()">
        📎 Прикрепить фото
      </button>
      <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
    </div>

    <div class="input-box">
      <input type="text" id="userInput" placeholder="Спросите Mazur.ai..." autocomplete="off">
      <button class="send-btn" id="sendBtn">⬆️</button>
    </div>
  </div>
</div>

<script>
  const chatBox = document.getElementById('chat');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const chatListEl = document.getElementById('chatList');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  const reasoningBtn = document.getElementById('reasoningBtn');
  const attachBtn = document.getElementById('attachBtn');
  const imageInput = document.getElementById('imageInput');
  const imagePreviewContainer = document.getElementById('imagePreviewContainer');
  const imagePreview = document.getElementById('imagePreview');

  const COOLDOWN_SECONDS = 25; 
  let isCoolingDown = false;
  let isReasoningEnabled = false;
  let currentBase64Image = null; 

  let allChats = [];
  try {
    allChats = JSON.parse(localStorage.getItem('mazur_ai_chats_vision')) || [];
  } catch(e) {
    allChats = [];
  }
  let currentChatId = localStorage.getItem('mazur_ai_current_vision') || null;

  const SYSTEM_PROMPT = { role: "system", content: "Ты полезный ассистент по имени Mazur.ai. Отвечай кратко и по делу на русском языке." };

  function handleImageSelect(event) {
    const file = event.target.files[0];
    if (!file) return;
    attachBtn.innerHTML = '⏳ Загрузка...';

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        try {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 800;
          let width = img.width;
          let height = img.height;
          if (width > MAX_WIDTH) {
            height = Math.round((height * MAX_WIDTH) / width);
            width = MAX_WIDTH;
          }
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          currentBase64Image = canvas.toDataURL('image/jpeg', 0.7); 
          
          imagePreview.src = currentBase64Image;
          imagePreviewContainer.style.display = 'block';
          
          attachBtn.classList.add('active');
          attachBtn.innerHTML = '✅ Фото готово';
          setTimeout(() => { attachBtn.innerHTML = '📎 Фото'; }, 1500);
          userInput.focus();
        } catch (err) {
          alert("Не удалось обработать фото. Возможно, формат не поддерживается.");
          attachBtn.innerHTML = '📎 Прикрепить фото';
        }
      };
      img.onerror = function() {
        alert("Ошибка чтения файла. Попробуйте другое фото.");
        attachBtn.innerHTML = '📎 Прикрепить фото';
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
    event.target.value = '';
  }

  function clearImage() {
    currentBase64Image = null;
    imagePreviewContainer.style.display = 'none';
    imagePreview.src = '';
    attachBtn.classList.remove('active');
    attachBtn.innerHTML = '📎 Прикрепить фото';
  }

  function toggleReasoning() {
    isReasoningEnabled = !isReasoningEnabled;
    reasoningBtn.classList.toggle('active', isReasoningEnabled);
    userInput.placeholder = isReasoningEnabled ? "Задайте сложный вопрос..." : "Спросите Mazur.ai...";
  }

  function initApp() {
    if (allChats.length === 0) createNewChat();
    else {
      if (!currentChatId || !allChats.find(c => c.id == currentChatId)) currentChatId = allChats[0].id;
      renderChatList();
      loadChat(currentChatId);
    }
    userInput.disabled = false;
    sendBtn.disabled = false;
    isCoolingDown = false;
    userInput.focus();
  }

  function saveData() {
    try {
      localStorage.setItem('mazur_ai_chats_vision', JSON.stringify(allChats));
      localStorage.setItem('mazur_ai_current_vision', currentChatId);
    } catch(e) {
      console.warn("Память браузера переполнена.");
    }
  }

  function createNewChat() {
    const newChat = { id: Date.now().toString(), title: "Новый чат", messages: [SYSTEM_PROMPT] };
    allChats.unshift(newChat);
    currentChatId = newChat.id;
    saveData();
    renderChatList();
    loadChat(currentChatId);
    if (window.innerWidth < 768) toggleSidebar();
  }

  function deleteChat(id, event) {
    event.stopPropagation();
    if (!confirm("Удалить этот чат?")) return;
    allChats = allChats.filter(c => c.id !== id);
    if (currentChatId === id) {
      if (allChats.length > 0) { currentChatId = allChats[0].id; loadChat(currentChatId); }
      else { createNewChat(); return; }
    }
    saveData();
    renderChatList();
  }

  function switchChat(id) {
    currentChatId = id;
    saveData();
    renderChatList();
    loadChat(id);
    if (window.innerWidth < 768) toggleSidebar();
  }

  function renderChatList() {
    chatListEl.innerHTML = '';
    allChats.forEach(chat => {
      const el = document.createElement('div');
      el.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
      el.onclick = () => switchChat(chat.id);
      el.innerHTML = `<span class="chat-title">${chat.title}</span><button class="delete-chat-btn" onclick="deleteChat('${chat.id}', event)">🗑️</button>`;
      chatListEl.appendChild(el);
    });
  }

  function loadChat(id) {
    chatBox.innerHTML = '';
    const chat = allChats.find(c => c.id === id);
    if (!chat) return;

    if (chat.messages.length === 1) {
      addMessageUI('Привет! Я Mazur.ai. Покажи мне фото (кнопка "Прикрепить фото") или напиши текст.', 'ai');
    } else {
      chat.messages.forEach(msg => {
        if (msg.role !== 'system') {
          if (Array.isArray(msg.content)) {
            const textPart = msg.content.find(c => c.type === 'text')?.text || '';
            const imagePart = msg.content.find(c => c.type === 'image_url')?.image_url?.url;
            addMessageUI(textPart, msg.role, imagePart);
          } else {
            addMessageUI(msg.content, msg.role);
          }
        }
      });
    }
  }

  function addMessageUI(text, type, imageBase64 = null) {
    const wrapper = document.createElement('div');
    wrapper.className = `msg-wrapper ${type}`;
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = type === 'user' ? '👤' : '🤖';
    const content = document.createElement('div');
    content.className = 'msg-content';

    if (imageBase64) {
      const img = document.createElement('img');
      img.src = imageBase64;
      img.className = 'msg-image';
      content.appendChild(img);
    }

    if (text) {
      if (type === 'ai' && text.includes('<thought>')) {
        const thoughtMatch = text.match(/<thought>([\s\S]*?)<\/thought>/);
        if (thoughtMatch) {
          const thoughtText = thoughtMatch[1].trim();
          const cleanText = text.replace(/<thought>[\s\S]*?<\/thought>/, '').trim();
          const spoiler = document.createElement('div');
          spoiler.className = 'thought-block';
          spoiler.innerHTML = `
            <div class="thought-header" onclick="toggleThought(this)">
              <span>🧩 Процесс размышления</span> <span>▼</span>
            </div>
            <div class="thought-content">${thoughtText}</div>
          `;
          content.appendChild(spoiler);
          const answerDiv = document.createElement('div');
          answerDiv.textContent = cleanText;
          content.appendChild(answerDiv);
        } else {
          content.appendChild(document.createTextNode(text));
        }
      } else {
        content.appendChild(document.createTextNode(text));
      }
    }

    wrapper.appendChild(avatar);
    wrapper.appendChild(content);
    chatBox.appendChild(wrapper);
    chatBox.scrollTop = chatBox.scrollHeight;
    return content;
  }

  function toggleThought(headerEl) {
    const contentDiv = headerEl.nextElementSibling;
    contentDiv.classList.toggle('show');
    headerEl.querySelector('span:last-child').textContent = contentDiv.classList.contains('show') ? '▲' : '▼';
  }

  function toggleSidebar() {
    sidebar.classList.toggle('open');
    overlay.classList.toggle('show');
  }

  function startCooldown() {
    isCoolingDown = true;
    sendBtn.disabled = true;
    userInput.disabled = true;
    let timeLeft = COOLDOWN_SECONDS;
    sendBtn.textContent = timeLeft;
    userInput.placeholder = `Подождите ${timeLeft} сек...`;

    const timer = setInterval(() => {
      timeLeft--;
      if (timeLeft > 0) {
        sendBtn.textContent = timeLeft;
        userInput.placeholder = `Подождите ${timeLeft} сек...`;
      } else {
        clearInterval(timer);
        isCoolingDown = false;
        sendBtn.disabled = false;
        sendBtn.textContent = '⬆️';
        userInput.disabled = false;
        userInput.placeholder = isReasoningEnabled ? "Задайте сложный вопрос..." : "Спросите Mazur.ai...";
        userInput.focus();
      }
    }, 1000);
  }

  async function sendMessage() {
    if (isCoolingDown) return;
    const text = userInput.value.trim();
    if (!text && !currentBase64Image) return;

    const currentChat = allChats.find(c => c.id === currentChatId);
    if (currentChat.messages.length === 1) {
      currentChat.title = (text || "Фото").substring(0, 20) + '...';
      renderChatList();
    }

    let messageContent;
    if (currentBase64Image) {
      messageContent = [
        { type: "text", text: text || "Что на этой картинке?" },
        { type: "image_url", image_url: { url: currentBase64Image } }
      ];
    } else {
      messageContent = text;
    }

    addMessageUI(text || "Анализ изображения...", 'user', currentBase64Image);
    currentChat.messages.push({ role: "user", content: messageContent });
    saveData();

    userInput.value = '';
    clearImage(); 

    sendBtn.disabled = true;
    const typingContent = addMessageUI('', 'ai');
    typingContent.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';

    try {
      let messagesToSend = [...currentChat.messages];
      if (isReasoningEnabled) {
        messagesToSend.push({ role: "user", content: "Пожалуйста, перед тем как ответить, подробно порассуждай. Мысли оберни в тег <thought>...</thought>, а после него напиши финальный ответ." });
      }

      // Используем бесплатный шлюз VLM Run (модель Qwen2.5-VL)
      const response = await fetch('https://gateway.vlm.run/v1/openai/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          model: "qwen2.5-vl-72b-instruct", 
          messages: messagesToSend 
        })
      });

      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }

      const data = await response.json();
      typingContent.parentElement.remove();
      
      if (!data.choices || !data.choices[0] || !data.choices[0].message) {
        throw new Error("Некорректный ответ от сервера");
      }

      let aiText = data.choices[0].message.content;

      if (isReasoningEnabled && !aiText.includes('</thought>') && aiText.includes('<thought>')) {
          aiText += '</thought>\n';
      }

      addMessageUI(aiText, 'ai');
      currentChat.messages.push({ role: "assistant", content: aiText });
      saveData();
    } catch (error) {
      typingContent.parentElement.remove();
      console.error("Ошибка анализа:", error);
      // Если основной шлюз не ответил, пробуем резервный OVHcloud
      try {
        const fallbackResponse = await fetch('https://oai.endpoints.kepler.ai.cloud.ovh.net/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            model: "Qwen2.5-VL-72B-Instruct", 
            messages: currentChat.messages 
          })
        });
        const fallbackData = await fallbackResponse.json();
        if (fallbackData.choices?.[0]?.message?.content) {
          addMessageUI(fallbackData.choices[0].message.content, 'ai');
          currentChat.messages.push({ role: "assistant", content: fallbackData.choices[0].message.content });
          saveData();
          return;
        }
      } catch (e) {
        console.error("Резервный сервер также недоступен", e);
      }
      addMessageUI('Ошибка при анализе. Проверь интернет или подожди немного.', 'ai');
    } finally {
      startCooldown();
    }
  }

  initApp();
  sendBtn.addEventListener('click', sendMessage);
  userInput.addEventListener('keydown', (e) => { 
    if (e.key === 'Enter') {
      e.preventDefault();
      sendMessage(); 
    }
  });
</script>
</body>
</html>
