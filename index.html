<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MazurAi</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    /* --- СВЕТЛАЯ МИНИМАЛИСТИЧНАЯ ТЕМА --- */
    :root, body[data-theme="light"] {
      --bg: #ffffff; 
      --sidebar-bg: #f9f9f9; 
      --panel: #f4f4f5; 
      --text: #1a1a1a;
      --text-muted: #71717a; 
      --border: #e4e4e7; 
      --accent: #2563eb; 
      --active-chat-bg: #eff6ff; 
      --user-bg: #f4f4f5;
    }
    body[data-theme="dark"] {
      --bg: #212121; --sidebar-bg: #171717; --panel: #2f2f2f; --text: #ececec;
      --text-muted: #9b9b9b; --border: #424242; --accent: #3b82f6; 
      --active-chat-bg: #1e3a8a; --user-bg: #2f2f2f;
    }
    body[data-theme="nord"] {
      --bg: #2e3440; --sidebar-bg: #242933; --panel: #3b4252; --text: #eceff4;
      --text-muted: #d8dee9; --border: #4c566a; --accent: #88c0d0; 
      --active-chat-bg: #434c5e; --user-bg: #434c5e;
    }
    body[data-theme="sepia"] {
      --bg: #fdf6e3; --sidebar-bg: #f4ecd8; --panel: #f4ecd8; --text: #433422;
      --text-muted: #7a6b58; --border: #d5c4a1; --accent: #b58900; 
      --active-chat-bg: #fef3c7; --user-bg: #e6d7b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    html, body { height: 100%; width: 100%; overflow: hidden; background-color: var(--bg); }
    body { color: var(--text); height: 100dvh; display: flex; transition: background 0.3s, color 0.3s; -webkit-font-smoothing: antialiased; }

    /* --- ЭКРАН ВХОДА --- */
    #login-screen { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .login-box { background: var(--bg); padding: 30px; border-radius: 24px; width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 15px; text-align: center; }
    .login-box h2 { font-size: 24px; font-weight: 600; margin-bottom: 10px; color: var(--text); }
    .input-group { display: flex; flex-direction: column; gap: 12px; width: 100%; margin-bottom: 15px; }
    .login-box input { width: 100% !important; height: 52px !important; padding: 0 16px !important; border-radius: 12px !important; border: 1px solid var(--border) !important; background-color: var(--bg) !important; color: var(--text) !important; font-size: 16px !important; outline: none !important; transition: 0.2s; }
    .login-box input:focus { border-color: var(--accent) !important; }
    .btn-group { display: flex; gap: 10px; margin-top: 5px; }
    .login-box button { flex: 1; padding: 14px; border-radius: 12px; border: none; color: white; font-weight: 500; font-size: 15px; cursor: pointer; transition: 0.2s; }
    .btn-login { background: var(--text); }
    .btn-register { background: var(--panel); color: var(--text); }
    .forgot-btn { background: transparent !important; color: var(--text-muted) !important; font-size: 13px !important; border: none !important; cursor: pointer; padding: 5px !important; margin-top: 5px; }
    .forgot-btn:hover { color: var(--text) !important; }

    /* --- МОДАЛЬНЫЕ ОКНА (НАСТРОЙКИ И СБРОС) --- */
    #settings-modal, #reset-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index: 20000; align-items: center; justify-content: center; padding: 20px; }
    .settings-box { background: var(--bg); border-radius: 24px; width: 100%; max-width: 400px; padding: 24px; display: flex; flex-direction: column; gap: 20px; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
    .settings-box h3 { text-align: center; font-weight: 600; font-size: 20px; }
    .settings-section { display: flex; flex-direction: column; gap: 10px; }
    .settings-section h4 { font-size: 13px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
    .settings-box input, .settings-box select { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none; font-size: 15px; }
    .settings-box button { padding: 12px; border-radius: 12px; border: none; font-weight: 500; cursor: pointer; transition: 0.2s; font-size: 15px; }
    .btn-save { background: var(--text); color: var(--bg); }
    .btn-close { background: var(--panel); color: var(--text); margin-top: 10px; }
    .btn-danger { background: #fee2e2; color: #ef4444; }
    
    .toggle-row { display: flex; justify-content: space-between; align-items: center; }
    .toggle-switch { position: relative; display: inline-block; width: 50px; height: 28px; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border); transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(22px); }

    /* --- АДМИН ПАНЕЛЬ --- */
    #admin-panel { display: none; flex-direction: column; width: 100%; height: 100%; background: var(--bg); z-index: 9999; position: absolute; top: 0; left: 0; }
    .admin-header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .admin-btn { background: var(--panel); color: var(--text); border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 500; }
    .admin-tabs { display: flex; gap: 10px; padding: 10px 20px; border-bottom: 1px solid var(--border); overflow-x: auto; }
    .admin-tab { padding: 8px 16px; cursor: pointer; border-radius: 20px; font-weight: 500; color: var(--text-muted); font-size: 14px; white-space: nowrap; position: relative; }
    .admin-tab.active { background: var(--text); color: var(--bg); }
    .admin-content { display: none; flex: 1; flex-direction: column; overflow-y: auto; padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; }
    .admin-content.active { display: flex; }
    .admin-search-container { padding-bottom: 20px; }
    #admin-search, #user-search { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 15px; outline: none; }
    .admin-user-card { background: var(--panel); padding: 16px; border-radius: 16px; display: flex; flex-direction: column; gap: 12px; margin-bottom: 12px; }
    .admin-user-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .admin-user-name { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .admin-user-pass { font-size: 12px; color: var(--accent); background: rgba(37,99,235,0.1); padding: 2px 8px; border-radius: 6px; font-weight: 500; }
    .status-active { color: #10b981; font-size: 12px; font-weight: 500; background: rgba(16,185,129,0.1); padding: 2px 8px; border-radius: 6px;}
    .status-blocked { color: #ef4444; font-size: 12px; font-weight: 500; background: rgba(239,68,68,0.1); padding: 2px 8px; border-radius: 6px;}
    .admin-user-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .user-action-btn { padding: 8px 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 13px; background: var(--bg); color: var(--text); border: 1px solid var(--border); transition: 0.2s; }
    .user-action-btn:hover { background: var(--border); }
    .btn-approve { background: #d1fae5; color: #065f46; border: none; }
    .btn-reject { background: #fee2e2; color: #991b1b; border: none; }
    .admin-msg { background: var(--panel); padding: 16px; border-radius: 12px; font-size: 14px; margin-bottom: 12px; }
    .admin-msg .time { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
    
    #user-history-view { display: none; flex-direction: column; flex: 1; }
    .back-btn { background: var(--panel); color: var(--text); border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; margin-bottom: 16px; font-weight: 500; width: fit-content; }

    body.admin-mode #main-app { display: none; }
    body.admin-mode #admin-panel { display: flex; }
    body.admin-mode #login-screen { display: none; }

    /* --- ОСНОВНОЙ ИНТЕРФЕЙС --- */
    #main-app { display: flex; width: 100%; height: 100%; background: var(--bg); }
    
    /* --- САЙДБАР --- */
    #sidebar { width: 260px; background: var(--sidebar-bg); display: flex; flex-direction: column; transition: transform 0.3s ease; position: fixed; top: 0; bottom: 0; left: 0; z-index: 1000; transform: translateX(-100%); }
    #sidebar.open { transform: translateX(0); }
    #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    #overlay.show { opacity: 1; pointer-events: auto; }

    .sidebar-header { padding: 16px; }
    .new-chat-btn { width: 100%; padding: 12px 16px; background: transparent; border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 15px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: flex-start; gap: 10px; transition: 0.2s; }
    .new-chat-btn:hover { background: var(--panel); }
    
    .search-container { padding: 0 16px 16px 16px; }
    .search-container input { width: 100%; padding: 10px 16px; border-radius: 10px; background: var(--bg); border: none; color: var(--text); outline: none; font-size: 14px; }
    .search-container input::placeholder { color: var(--text-muted); }

    .chat-list { flex: 1; overflow-y: auto; padding: 0 8px; display: flex; flex-direction: column; gap: 2px; }
    
    .chat-group-title { font-size: 12px; color: var(--text-muted); padding: 16px 8px 8px 8px; font-weight: 500; }
    
    .chat-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; transition: 0.2s; }
    .chat-item:hover { background: var(--panel); }
    .chat-item.active { background: var(--active-chat-bg); color: var(--accent); font-weight: 500; }
    .chat-title { overflow: hidden; text-overflow: ellipsis; flex: 1; pointer-events: none; }
    .delete-chat-btn { background: transparent; border: none; cursor: pointer; opacity: 0; font-size: 14px; color: var(--text-muted); }
    .chat-item:hover .delete-chat-btn { opacity: 1; }
    .chat-item.active .delete-chat-btn { color: var(--accent); }

    .no-search-results { padding: 20px; text-align: center; color: var(--text-muted); font-size: 14px; }

    .sidebar-footer { padding: 16px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .user-profile { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 14px; cursor: pointer; color: var(--text); }
    .user-avatar-icon { width: 28px; height: 28px; border-radius: 50%; background: var(--text); color: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .settings-icon-btn { background: transparent; border: none; font-size: 18px; cursor: pointer; color: var(--text-muted); transition: 0.2s; }
    .settings-icon-btn:hover { color: var(--text); }

    /* --- ОСНОВНАЯ ОБЛАСТЬ ЧАТА --- */
    .main-content { flex: 1; display: flex; flex-direction: column; height: 100%; width: 100%; overflow: hidden; min-width: 0; }
    
    header { padding: 16px 20px; display: flex; align-items: center; gap: 16px; z-index: 10; }
    .menu-btn { background: transparent; border: none; color: var(--text); font-size: 20px; cursor: pointer; display: flex; padding: 4px; }
    .chat-title-header { font-weight: 500; font-size: 16px; color: var(--text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .new-chat-icon-btn { background: transparent; border: none; color: var(--text); font-size: 20px; cursor: pointer; display: flex; padding: 4px; transition: 0.2s; }
    .new-chat-icon-btn:hover { color: var(--accent); }

    #chat-container { flex: 1; display: flex; flex-direction: column; overflow-y: auto; position: relative; }
    #welcome-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; flex: 1; }
    #welcome-emoji { font-size: 60px; margin-bottom: 24px; line-height: 1; }
    #welcome-screen h1 { font-size: 24px; font-weight: 600; color: var(--text); margin-bottom: 10px; }

    #messages { display: flex; flex-direction: column; gap: 24px; padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; flex: 1; }
    
    .msg-wrapper { display: flex; gap: 16px; width: 100%; animation: fadeIn 0.2s ease; align-items: flex-start; }
    .msg-wrapper.user { flex-direction: row-reverse; }
    
    .avatar { 
      width: 36px; 
      height: 36px; 
      border-radius: 50%; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 20px; 
      flex-shrink: 0; 
    }
    .user .avatar { background: var(--panel); color: var(--text); font-size: 14px; font-weight: 600; }
    .ai .avatar { background: var(--active-chat-bg); color: var(--accent); font-size: 22px; }

    .msg-content { max-width: 85%; padding: 10px 18px; border-radius: 20px; font-size: 15px; line-height: 1.6; overflow-wrap: break-word; }
    .user .msg-content { background: var(--user-bg); color: var(--text); border-bottom-right-radius: 4px; }
    .ai .msg-content { background: transparent; width: 100%; color: var(--text); padding: 6px 0; }

    /* БЕЙДЖ РАЗМЫШЛЕНИЯ */
    .thought-header {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      background: var(--panel);
      transition: background 0.2s;
    }
    .thought-header:hover { background: var(--border); }
    .thought-header span { font-size: 12px; margin-left: 2px; }

    .msg-content p { margin-bottom: 12px; }
    .msg-content p:last-child { margin-bottom: 0; }
    .msg-content ul, .msg-content ol { margin-left: 20px; margin-bottom: 12px; }
    .msg-content li { margin-bottom: 8px; }
    
    .copy-btn { display: inline-block; margin-top: 12px; padding: 6px 12px; background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--text-muted); font-size: 13px; cursor: pointer; transition: 0.2s; font-weight: 500; }
    .copy-btn:hover { background: var(--panel); color: var(--text); }

    .thinking-container { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
    .typing-dots { display: flex; gap: 4px; align-items: center; height: 20px; }
    .typing-dots span { width: 6px; height: 6px; background-color: var(--text-muted); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
    .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
    .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
    .think-text { font-size: 14px; color: var(--text-muted); font-style: italic; }

    /* --- ПОЛЕ ВВОДА (КАПСУЛА) --- */
    .input-container { padding: 16px 20px 24px 20px; max-width: 800px; margin: 0 auto; width: 100%; flex-shrink: 0; }
    form.chat-form { display: flex; align-items: center; background: var(--bg); border: 1px solid var(--border); border-radius: 32px; padding: 8px 8px 8px 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); transition: 0.2s; }
    form.chat-form:focus-within { border-color: var(--accent); box-shadow: 0 4px 20px rgba(37,99,235,0.1); }
    
    .input-actions { display: flex; align-items: center; gap: 8px; margin-right: 10px; }
    .action-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s; font-weight: 500; white-space: nowrap; }
    .action-btn.active { background: var(--active-chat-bg); border-color: var(--accent); color: var(--accent); }
    .action-btn:hover { background: var(--panel); }

    input#prompt { flex: 1; background: transparent; border: none; color: var(--text); font-size: 16px; outline: none; padding: 8px 0; min-width: 0; }
    input#prompt::placeholder { color: var(--text-muted); }
    input#prompt:disabled { opacity: 0.5; cursor: not-allowed; }
    
    button[type="submit"] { background: var(--text); color: var(--bg); border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: 0.2s; }
    button[type="submit"]:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

    @media (min-width: 768px) { 
      #sidebar { position: static; transform: translateX(0); } 
      #overlay { display: none !important; } 
      .menu-btn { display: none; } 
    }
  </style>
</head>
<body data-theme="light">

  <!-- ЭКРАН ВХОДА/РЕГИСТРАЦИИ -->
  <div id="login-screen">
    <div class="login-box">
      <div style="font-size: 40px; margin-bottom: 10px;">🐳</div>
      <h2>Вход в MazurAi</h2>
      <p style="color: var(--text-muted); font-size: 14px;" id="login-subtitle">Войдите или создайте новый аккаунт</p>
      
      <div class="input-group">
        <input type="text" id="login-name" placeholder="Ваше имя" autocomplete="off">
        <input type="password" id="login-pass" placeholder="Ваш пароль" autocomplete="off">
      </div>
      
      <div class="btn-group">
        <button class="btn-login" onclick="loginUser()">Войти</button>
        <button class="btn-register" id="reg-btn" onclick="registerUser()">Регистрация</button>
      </div>
      
      <button class="forgot-btn" onclick="openResetModal()">Забыли пароль или ник?</button>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО СБРОСА ПАРОЛЯ -->
  <div id="reset-modal">
    <div class="settings-box">
      <h3>Восстановление</h3>
      <p style="color: var(--text-muted); font-size: 14px; text-align: center; margin-top: -10px;">
        Введите старый ник и новый пароль.
      </p>
      
      <div class="settings-section" style="margin-top: 10px;">
        <input type="text" id="reset-name" placeholder="Старый ник" autocomplete="off">
        <input type="text" id="reset-newname" placeholder="Новый ник (необязательно)" autocomplete="off">
        <input type="password" id="reset-pass" placeholder="Новый пароль" autocomplete="off">
      </div>
      
      <div class="btn-group" style="margin-top: 10px;">
        <button class="btn-login" onclick="submitResetRequest()" style="background: var(--text); color: var(--bg);">Отправить</button>
        <button class="btn-register" onclick="closeResetModal()" style="background: var(--panel); color: var(--text);">Отмена</button>
      </div>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО НАСТРОЕК -->
  <div id="settings-modal">
    <div class="settings-box">
      <h3>Настройки</h3>
      
      <div class="settings-section">
        <h4>Профиль</h4>
        <input type="text" id="set-nickname" placeholder="Новый никнейм">
        <button class="btn-save" onclick="changeNickname()">Сменить ник</button>
        <input type="password" id="set-password" placeholder="Новый пароль" style="margin-top: 8px;">
        <button class="btn-save" onclick="changePassword()">Сменить пароль</button>
      </div>

      <div class="settings-section">
        <h4>Внешний вид</h4>
        <select id="set-theme" onchange="changeTheme(this.value)">
          <option value="light">☀️ Светлая (Минимализм)</option>
          <option value="dark">🌙 Тёмная</option>
          <option value="nord">❄️ Северная</option>
          <option value="sepia">📜 Сепия</option>
        </select>
      </div>

      <div class="settings-section">
        <h4>Характер ИИ</h4>
        <div class="toggle-row">
          <span style="font-size: 15px;">Режим «Невежа»</span>
          <label class="toggle-switch">
            <input type="checkbox" id="set-rude-mode" onchange="toggleRudeMode()">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="settings-section">
        <button class="btn-danger" onclick="logout()">Выйти из аккаунта</button>
      </div>

      <button class="btn-close" onclick="closeSettings()">Закрыть</button>
    </div>
  </div>

  <!-- СЕКРЕТНАЯ АДМИНКА -->
  <div id="admin-panel">
    <div class="admin-header">
      <h2 style="font-size: 18px; font-weight: 600;">Админ-панель</h2>
      <button class="admin-btn" onclick="window.location.href = window.location.pathname">Выйти</button>
    </div>
    
    <div class="admin-tabs">
      <div class="admin-tab active" onclick="switchAdminTab('users', event)">Пользователи</div>
      <div class="admin-tab" onclick="switchAdminTab('logs', event)">Логи</div>
      <div class="admin-tab" onclick="switchAdminTab('requests', event)">
        Запросы
        <span id="req-badge" style="background:#ef4444; color:white; border-radius:10px; padding:2px 6px; font-size:11px; position:absolute; top:0px; right:0px; display:none;">0</span>
      </div>
    </div>

    <div class="admin-content active" id="content-users">
      <div id="users-main-view">
        <div class="admin-search-container">
          <input type="text" id="user-search" placeholder="Поиск по имени..." oninput="filterAdminUsers()">
        </div>
        <div id="admin-users-list"></div>

      <div id="user-history-view">
        <button class="back-btn" onclick="closeUserHistory()">← Назад к списку</button>

    <div class="admin-content" id="content-logs">
      <div class="admin-search-container">

    <div class="admin-content" id="content-requests">
      <div id="admin-requests-list"></div>

  <!-- ОСНОВНОЙ САЙТ -->
  <div id="main-app" style="display: none;">
    <div id="sidebar">
      <div class="sidebar-header">
        <button class="new-chat-btn" onclick="createNewChat()">
          <span style="font-size: 18px;">＋</span> Новый чат
        </button>
      </div>
      
      <div class="search-container">
        <input type="text" id="chat-search" placeholder="Поиск в содержимом чата..." oninput="filterChats()">
      </div>

      <div class="chat-list" id="chatList"></div>
      
      <div class="sidebar-footer">
        <div class="user-profile" onclick="openSettings()">
          <div class="user-avatar-icon" id="user-avatar-letter">U</div>
          <span id="display-username">User</span>
        </div>
        <button class="settings-icon-btn" onclick="openSettings()" title="Настройки">⚙️</button>

    <div class="main-content">
      <header>
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>

      <div id="chat-container">

          <div id="welcome-emoji">🐳</div>
          <h1>Чем я могу помочь?</h1>
        </div>
        <div id="messages" style="display: none;"></div>
      </div>

      <div class="input-container">
        <form class="chat-form" id="chat-form">
          <div class="input-actions">
            <button type="button" class="action-btn" id="reasoningBtn" onclick="toggleReasoning()">🧠 Рассуждение</button>
          </div>
          <input id="prompt" type="text" placeholder="Напишите сообщение..." autocomplete="off" required>
          <button type="submit" id="sendBtn">↑</button>
        </form>
      </div>

  </div>

  <script>
    if (window.location.search.includes('reset')) {
      localStorage.removeItem('mazur_device_locked');
      localStorage.removeItem('mazur_current_user');
      alert("🔓 Устройство разблокировано для тестов!");
      window.location.href = window.location.pathname; 
    }

    const firebaseConfig = {
      apiKey: "AIzaSyBS7dFzmVxoNdRPHKaQybmg7mXHC3yhMKI",
      authDomain: "mazurai-c934a.firebaseapp.com",
      databaseURL: "https://mazurai-c934a-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "mazurai-c934a",
      storageBucket: "mazurai-c934a.firebasestorage.app",
      messagingSenderId: "364799393982",
      appId: "1:364799393982:web:e27bd20e9d4bca3ed65eef"
    };

    let db = null;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    } catch (e) { console.warn("Ошибка Firebase."); }

    let currentUser = JSON.parse(localStorage.getItem('mazur_current_user')) || null;
    let userListener = null;
    let allChats = [];
    let currentChatId = null;
    let isMigrating = false; 

    const savedTheme = localStorage.getItem('mazur_theme') || 'light';
    document.body.setAttribute('data-theme', savedTheme);
    const isRudeModeSaved = localStorage.getItem('mazur_rude_mode') === 'true';
    document.getElementById('set-rude-mode').checked = isRudeModeSaved;
    document.getElementById('set-theme').value = savedTheme;

    function openResetModal() {
      document.getElementById('reset-modal').style.display = 'flex';
    }
    function closeResetModal() {
      document.getElementById('reset-modal').style.display = 'none';
      document.getElementById('reset-name').value = '';
      document.getElementById('reset-newname').value = '';
      document.getElementById('reset-pass').value = '';
    }

    async function submitResetRequest() {
      const name = document.getElementById('reset-name').value.trim();
      const newName = document.getElementById('reset-newname').value.trim();
      const newPass = document.getElementById('reset-pass').value.trim();
      
      if (!name || !newPass) return alert("Заполните старый ник и новый пароль!");
      if (newName === name) return alert("Старый и новый ник совпадают.");

      try {
        const snapshot = await db.ref('users/' + name).once('value');
        if (!snapshot.exists()) {
          return alert(`❌ Пользователь с ником "${name}" не найден.\n\n⚠️ В никах важен регистр букв.`);
        }
        
        if (newName) {
          const newSnap = await db.ref('users/' + newName).once('value');
          if (newSnap.exists()) return alert("❌ Новый ник уже занят! Выберите другой.");
        }

        await db.ref('users/' + name + '/reset_requested').set(true);
        await db.ref('reset_requests').push({
          user: name,
          newName: newName || null,
          newPass: newPass,
          time: new Date().toLocaleString()
        });

        alert("✅ Запрос отправлен! Ожидайте одобрения администратора.");
        closeResetModal();
      } catch (e) {
        alert("Ошибка: " + e.message);
      }
    }

    function openSettings() {
      updateSettingsUI();
      document.getElementById('settings-modal').style.display = 'flex';
    }
    
    function updateSettingsUI() {
      if (!currentUser) return;
      document.getElementById('set-nickname').placeholder = `Новый ник (сейчас: ${currentUser.name})`;
      document.getElementById('set-password').placeholder = `Новый пароль`;
    }

    function closeSettings() {
      document.getElementById('settings-modal').style.display = 'none';
    }

    function changeTheme(theme) {
      document.body.setAttribute('data-theme', theme);
      localStorage.setItem('mazur_theme', theme);
    }

    function toggleRudeMode() {
      const isRude = document.getElementById('set-rude-mode').checked;
      localStorage.setItem('mazur_rude_mode', isRude);
    }

    async function changePassword() {
      const newPass = document.getElementById('set-password').value.trim();
      if (!newPass) return alert("Введите новый пароль!");

      try {
        await db.ref('users/' + currentUser.name + '/password').set(newPass);
        currentUser.pass = newPass;
        localStorage.setItem('mazur_current_user', JSON.stringify(currentUser));
        alert("✅ Пароль успешно изменен!");
        document.getElementById('set-password').value = '';
      } catch (e) {
        alert("Ошибка: " + e.message);
      }
    }

    async function changeNickname() {
      const newName = document.getElementById('set-nickname').value.trim().replace(/\s+/g, '');
      if (!newName) return alert("Введите новый ник!");
      if (newName === currentUser.name) return alert("Это ваш текущий ник.");

      try {
        const snapshot = await db.ref('users/' + newName).once('value');
        if (snapshot.exists()) return alert("❌ Этот ник уже занят!");

        isMigrating = true; 

        const oldName = currentUser.name;
        if (userListener) db.ref('users/' + oldName).off('value', userListener);

        const chatsSnapshot = await db.ref('users/' + oldName + '/chats').once('value');
        const chatsToMigrate = chatsSnapshot.exists() ? chatsSnapshot.val() : allChats;

        await db.ref('users/' + newName).set({ 
          password: currentUser.pass, 
          blocked: false,
          reset_requested: false,
          lastActive: firebase.database.ServerValue.TIMESTAMP,
          chats: chatsToMigrate 
        });
        
        await db.ref('users/' + oldName).remove();

        const oldChatsKey = 'mazur_chats_' + oldName;
        const newChatsKey = 'mazur_chats_' + newName;
        localStorage.setItem(newChatsKey, localStorage.getItem(oldChatsKey));
        localStorage.removeItem(oldChatsKey);

        currentUser.name = newName;
        localStorage.setItem('mazur_current_user', JSON.stringify(currentUser));
        
        document.getElementById('display-username').innerText = newName;
        document.getElementById('user-avatar-letter').innerText = newName.charAt(0).toUpperCase();
        document.getElementById('set-nickname').value = '';
        updateSettingsUI();
        
        isMigrating = false; 

        alert("✅ Ник успешно изменен! При следующем входе используйте НОВЫЙ ник.");
        
        monitorUserStatus(); 
        initApp(); 
      } catch (e) {
        isMigrating = false; 
        alert("Ошибка базы данных: " + e.message);
      }
    }

    async function registerUser() {
      const name = document.getElementById('login-name').value.trim().replace(/\s+/g, '');
      const pass = document.getElementById('login-pass').value.trim();
      
      if (!name || !pass) return alert("Пожалуйста, заполните имя и пароль!");

      try {
        const snapshot = await db.ref('users/' + name).once('value');
        if (snapshot.exists()) {
          return alert("❌ Это имя уже занято! Выберите другое.");
        }
        
        await db.ref('users/' + name).set({ 
          password: pass, 
          blocked: false, 
          reset_requested: false,
          lastActive: firebase.database.ServerValue.TIMESTAMP,
          chats: [] 
        });
        
        localStorage.setItem('mazur_device_locked', 'true');
        
        alert("✅ Регистрация успешна!");
        loginSuccess(name, pass);
      } catch (e) {
        alert("Ошибка базы данных: " + e.message);
      }
    }

    async function loginUser() {
      const name = document.getElementById('login-name').value.trim().replace(/\s+/g, '');
      const pass = document.getElementById('login-pass').value.trim();
      
      if (!name || !pass) return alert("Пожалуйста, заполните имя и пароль!");

      try {
        const snapshot = await db.ref('users/' + name).once('value');
        
        if (!snapshot.exists()) {
          const isLocked = localStorage.getItem('mazur_device_locked') === 'true';
          if (isLocked) {
            return alert("❌ Пользователь не найден. Введите правильное имя.");
          } else {
            return alert("❌ Пользователь не найден. Нажмите 'Регистрация'.");
          }
        }
        
        const userData = snapshot.val();

        if (userData.reset_requested === true) {
          return alert("⏳ Вы запросили сброс данных. Дождитесь одобрения администратора.");
        }
        if (userData.blocked === true) {
          return alert("🚫 Ваш аккаунт заблокирован.");
        }
        if (userData.password !== pass) {
          return alert("❌ Неверный пароль!");
        }

        loginSuccess(name, pass);
      } catch (e) {
        alert("Ошибка базы данных: " + e.message);
      }
    }

    async function loginSuccess(name, pass) {
      currentUser = { name: name, pass: pass };
      localStorage.setItem('mazur_current_user', JSON.stringify(currentUser));
      localStorage.setItem('mazur_device_locked', 'true');
      
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('main-app').style.display = 'flex';
      
      document.getElementById('display-username').innerText = name;
      document.getElementById('user-avatar-letter').innerText = name.charAt(0).toUpperCase();
      
      document.getElementById('login-name').value = '';
      document.getElementById('login-pass').value = '';

      if (db) {
        db.ref('users/' + name + '/lastActive').set(firebase.database.ServerValue.TIMESTAMP);
      }

      try {
        const chatsSnapshot = await db.ref('users/' + name + '/chats').once('value');
        if (chatsSnapshot.exists() && chatsSnapshot.val() !== null) {
          allChats = chatsSnapshot.val();
          localStorage.setItem('mazur_chats_' + name, JSON.stringify(allChats));
        } else {
          allChats = JSON.parse(localStorage.getItem('mazur_chats_' + name)) || [];
        }
      } catch (e) {
        allChats = JSON.parse(localStorage.getItem('mazur_chats_' + name)) || [];
      }
      
      initApp();
      monitorUserStatus(); 
    }

    function monitorUserStatus() {
      if (!currentUser) return;
      if (userListener) db.ref('users/' + currentUser.name).off('value', userListener);
      
      userListener = db.ref('users/' + currentUser.name).on('value', (snapshot) => {
        const data = snapshot.val();
        
        if (!data) {
          if (isMigrating) return; 
          alert("Ваш аккаунт был удален администратором.");
          localStorage.removeItem('mazur_current_user');
          localStorage.setItem('mazur_device_locked', 'false');
          forceLogout();
        } else if (data.blocked === true) {
          if (isMigrating) return; 
          alert("Ваш аккаунт заблокирован администратором.");
          localStorage.removeItem('mazur_current_user');
          localStorage.setItem('mazur_device_locked', 'true');
          forceLogout();
        } else if (data.blocked === false) {
          localStorage.setItem('mazur_device_locked', 'true');
          checkDeviceLock();
        }
      });
    }

    function forceLogout() {
      if (userListener) db.ref('users/' + currentUser.name).off('value', userListener);
      currentUser = null;
      document.getElementById('main-app').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
      closeSettings();
      checkDeviceLock();
    }

    function checkDeviceLock() {
      const isLocked = localStorage.getItem('mazur_device_locked') === 'true';
      const regBtn = document.getElementById('reg-btn');
      const subtitle = document.getElementById('login-subtitle');
      
      if (isLocked) {
        regBtn.style.display = 'none'; 
        subtitle.innerText = "Войдите в свой аккаунт";
      } else {
        regBtn.style.display = 'block';
        subtitle.innerText = "Войдите или создайте новый аккаунт";
      }
    }

    function logout() {
      if (userListener) db.ref('users/' + currentUser.name).off('value', userListener);
      localStorage.removeItem('mazur_current_user');
      currentUser = null;
      
      document.getElementById('main-app').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
      
      document.getElementById('login-name').value = '';
      document.getElementById('login-pass').value = '';
      
      closeSettings();
      checkDeviceLock(); 
      toggleSidebar();
    }

    if (currentUser) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('main-app').style.display = 'flex';
      document.getElementById('display-username').innerText = currentUser.name;
      document.getElementById('user-avatar-letter').innerText = currentUser.name.charAt(0).toUpperCase();
      
      db.ref('users/' + currentUser.name + '/lastActive').set(firebase.database.ServerValue.TIMESTAMP);

      db.ref('users/' + currentUser.name + '/chats').once('value').then(snapshot => {
        if (snapshot.exists() && snapshot.val() !== null) {
          allChats = snapshot.val();
          localStorage.setItem('mazur_chats_' + currentUser.name, JSON.stringify(allChats));
        } else {
          allChats = JSON.parse(localStorage.getItem('mazur_chats_' + currentUser.name)) || [];
        }
        initApp();
        monitorUserStatus();
      }).catch(e => {
        allChats = JSON.parse(localStorage.getItem('mazur_chats_' + currentUser.name)) || [];
        initApp();
        monitorUserStatus();
      });
      
    } else if (!window.location.search.includes('admin')) {
      document.getElementById('login-screen').style.display = 'flex';
      checkDeviceLock(); 
    }

    const ADMIN_PASSWORD = "admin123"; 
    let allAdminLogs = [];
    let allAdminUsers = [];
    let allAdminRequests = [];

    if (window.location.search.includes('admin')) {
      const pass = prompt("Введите пароль администратора:");
      if (pass === ADMIN_PASSWORD) {
        document.body.classList.add('admin-mode');
        loadAdminLogs();
        loadAdminUsers();
        loadAdminRequests();
      } else {
        alert("Неверный пароль!");
        window.location.href = window.location.pathname;
      }
    }

    async function cleanupInactiveUsers() {
      if (!db) return;
      try {
        const snapshot = await db.ref('users').once('value');
        const now = Date.now();
        const oneWeek = 7 * 24 * 60 * 60 * 1000; 

        snapshot.forEach((child) => {
          const userData = child.val();
          const name = child.key;

          if (userData.lastActive) {
            if (now - userData.lastActive > oneWeek) {
              db.ref('users/' + name).remove();
            }
          } else {
            db.ref('users/' + name + '/lastActive').set(firebase.database.ServerValue.TIMESTAMP);
          }
        });
      } catch (e) {}
    }
    setTimeout(cleanupInactiveUsers, 5000);

    function switchAdminTab(tab, event) {
      document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.admin-content').forEach(c => c.classList.remove('active'));
      
      event.currentTarget.classList.add('active');
      document.getElementById('content-' + tab).classList.add('active');
      
      if (tab === 'requests') loadAdminRequests();
    }

    function loadAdminRequests() {
      if(!db) return;
      const listEl = document.getElementById('admin-requests-list');
      const badge = document.getElementById('req-badge');
      listEl.innerHTML = '<p style="text-align:center; color:#9b9b9b;">Загрузка...</p>';
      
      db.ref('reset_requests').once('value').then((snapshot) => {
        allAdminRequests = []; 
        if (!snapshot.exists()) {
          listEl.innerHTML = '<p class="no-results" style="text-align:center;">Нет активных запросов.</p>';
          badge.style.display = 'none';
          return;
        }
        
        snapshot.forEach((child) => { 
          allAdminRequests.push({ id: child.key, data: child.val() }); 
        });

        badge.style.display = 'inline-block';
        badge.innerText = allAdminRequests.length;
        
        renderAdminRequests();
      });
    }

    function renderAdminRequests() {
      const listEl = document.getElementById('admin-requests-list');
      listEl.innerHTML = '';

      if (allAdminRequests.length === 0) {
        listEl.innerHTML = '<p class="no-results" style="text-align:center;">Нет активных запросов.</p>';
        return;
      }

      allAdminRequests.forEach(req => {
        const div = document.createElement('div');
        div.className = 'admin-user-card';
        
        let changeText = `Новый пароль: <b>${req.data.newPass}</b>`;
        if (req.data.newName) {
          changeText += `<br>Новый ник: <b>${req.data.newName}</b>`;
        }
        
        div.innerHTML = `
          <div class="admin-user-header">
            <span class="admin-user-name">👤 ${req.data.user}</span>
            <span class="status-blocked">Сброс</span>
          </div>
          <div style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">📅 ${req.data.time}</div>
          <div style="font-size: 14px; margin-top: 8px;">${changeText}</div>
          <div class="admin-user-actions" style="margin-top: 12px;">
            <button class="user-action-btn btn-approve" 
                    data-id="${req.id}" 
                    data-user="${req.data.user}" 
                    data-pass="${req.data.newPass}" 
                    data-newname="${req.data.newName || ''}" 
                    onclick="approveReset(this)">✅ Одобрить</button>
            <button class="user-action-btn btn-reject" 
                    data-id="${req.id}" 
                    data-user="${req.data.user}" 
                    onclick="rejectReset(this)">❌ Отклонить</button>
          </div>
        `;
        listEl.appendChild(div);
      });
    }

    async function approveReset(btn) {
      const reqId = btn.getAttribute('data-id');
      const oldName = btn.getAttribute('data-user');
      const newPass = btn.getAttribute('data-pass');
      const newName = btn.getAttribute('data-newname');
      
      if (!confirm(`Одобрить изменения для ${oldName}?`)) return;
      
      try {
        if (newName) {
          const snap = await db.ref('users/' + newName).once('value');
          if (snap.exists()) return alert(`❌ Ник ${newName} уже занят!`);
          
          const chatsSnap = await db.ref('users/' + oldName + '/chats').once('value');
          const oldChats = chatsSnap.exists() ? chatsSnap.val() : [];

          await db.ref('users/' + newName).set({ 
            password: newPass, 
            blocked: false, 
            reset_requested: false,
            lastActive: firebase.database.ServerValue.TIMESTAMP,
            chats: oldChats
          });
          
          await db.ref('users/' + oldName).remove();
          alert(`✅ Данные перенесены на ник ${newName}!`);
        } else {
          await db.ref('users/' + oldName + '/password').set(newPass);
          await db.ref('users/' + oldName + '/reset_requested').set(false);
          alert(`✅ Пароль для ${oldName} изменен!`);
        }
        
        await db.ref('reset_requests/' + reqId).remove();
        loadAdminRequests();
        loadAdminUsers();
      } catch (e) {
        alert("Ошибка: " + e.message);
      }
    }

    async function rejectReset(btn) {
      const reqId = btn.getAttribute('data-id');
      const username = btn.getAttribute('data-user');
      
      if (!confirm(`Отклонить сброс для ${username}?`)) return;
      
      try {
        await db.ref('users/' + username + '/reset_requested').set(false);
        await db.ref('reset_requests/' + reqId).remove();
        alert(`❌ Запрос отклонен.`);
        loadAdminRequests();
      } catch (e) {
        alert("Ошибка: " + e.message);
      }
    }

    function loadAdminLogs() {
      if(!db) return;
      const listEl = document.getElementById('admin-list');
      listEl.innerHTML = '<p style="text-align:center; color:#9b9b9b;">Загрузка...</p>';
      
      db.ref('logs').once('value').then((snapshot) => {
        allAdminLogs = []; 
        if (!snapshot.exists()) {
          listEl.innerHTML = '<p class="no-results" style="text-align:center;">Сообщений пока нет.</p>';
          return;
        }
        snapshot.forEach((child) => { allAdminLogs.push(child.val()); });
        allAdminLogs.reverse(); 
        document.getElementById('admin-search').value = '';
        renderAdminLogs('');
      });
    }

    function filterAdminLogs() {
      const query = document.getElementById('admin-search').value.trim().toLowerCase();
      renderAdminLogs(query);
    }

    function renderAdminLogs(searchQuery) {
      const listEl = document.getElementById('admin-list');
      listEl.innerHTML = '';

      const filteredLogs = allAdminLogs.filter(log => {
        if (!searchQuery) return true;
        const userStr = (log.user || '').toLowerCase();
        const textStr = ((log.userText || '') + (log.aiText || '') + (log.text || '')).toLowerCase();
        return userStr.includes(searchQuery) || textStr.includes(searchQuery);
      });

      if (filteredLogs.length === 0) {
        listEl.innerHTML = '<p class="no-results" style="text-align:center;">Логов не найдено.</p>';
        return;
      }

      filteredLogs.forEach(msg => {
        const div = document.createElement('div');
        div.className = 'admin-msg';
        const userText = msg.userText || msg.text || 'Нет текста';
        const aiText = msg.aiText || 'Нет ответа';
        
        div.innerHTML = `
          <div class="time">📅 ${msg.time}</div>
          <div>👤 <b>${msg.user}</b> | 🔑 <b>${msg.pass || 'Неизвестно'}</b></div>
          <div style="margin-top:8px; border-top:1px solid var(--border); padding-top:8px;">🗣️ <b>Пользователь:</b> ${userText}</div>
          <div style="margin-top:4px; color: var(--accent);">🤖 <b>ИИ:</b> ${aiText}</div>
        `;
        listEl.appendChild(div);
      });
    }

    function loadAdminUsers() {
      if(!db) return;
      const listEl = document.getElementById('admin-users-list');
      listEl.innerHTML = '<p style="text-align:center; color:#9b9b9b;">Загрузка...</p>';
      
      db.ref('users').once('value').then((snapshot) => {
        allAdminUsers = []; 
        if (!snapshot.exists()) {
          listEl.innerHTML = '<p class="no-results" style="text-align:center;">Пользователей пока нет.</p>';
          return;
        }
        snapshot.forEach((child) => { 
          allAdminUsers.push({ name: child.key, data: child.val() }); 
        });
        document.getElementById('user-search').value = '';
        renderAdminUsers('');
      });
    }

    function filterAdminUsers() {
      const query = document.getElementById('user-search').value.trim().toLowerCase();
      renderAdminUsers(query);
    }

    function renderAdminUsers(searchQuery) {
      const listEl = document.getElementById('admin-users-list');
      listEl.innerHTML = '';

      const filteredUsers = allAdminUsers.filter(u => {
        if (!searchQuery) return true;
        return u.name.toLowerCase().includes(searchQuery);
      });

      if (filteredUsers.length === 0) {
        listEl.innerHTML = '<p class="no-results" style="text-align:center;">Пользователей не найдено.</p>';
        return;
      }

      filteredUsers.forEach(u => {
        const isBlocked = u.data.blocked === true;
        const isReset = u.data.reset_requested === true;
        
        const passText = u.data.password ? `<span class="admin-user-pass">🔑 ${u.data.password}</span>` : `<span class="admin-user-pass" style="color:var(--text-muted); background:transparent;">🔑 скрыт</span>`;

        const div = document.createElement('div');
        div.className = 'admin-user-card';
        div.innerHTML = `
          <div class="admin-user-header">
            <span class="admin-user-name">👤 ${u.name} ${passText}</span>
            <span class="${isBlocked ? 'status-blocked' : 'status-active'}">${isBlocked ? '🚫 Заблокирован' : (isReset ? '⏳ Ждет сброса' : '✅ Активен')}</span>
          </div>
          <div class="admin-user-actions">
            <button class="user-action-btn btn-history" onclick="viewUserHistory('${u.name}')">Переписка</button>
            <button class="user-action-btn ${isBlocked ? 'btn-unblock' : 'btn-block'}" onclick="toggleBlock('${u.name}', ${isBlocked})">
              ${isBlocked ? 'Разблокировать' : 'Заблокировать'}
            </button>
            <button class="user-action-btn btn-delete" onclick="deleteUser('${u.name}')">Удалить</button>
          </div>
        `;
        listEl.appendChild(div);
      });
    }

    function toggleBlock(username, isBlocked) {
      const action = isBlocked ? 'разблокировать' : 'заблокировать';
      if (!confirm(`Вы уверены, что хотите ${action} пользователя ${username}?`)) return;

      db.ref('users/' + username + '/blocked').set(!isBlocked).then(() => {
        loadAdminUsers(); 
      });
    }

    function deleteUser(username) {
      if (!confirm(`Вы уверены, что хотите УДАЛИТЬ пользователя ${username}?`)) return;

      db.ref('users/' + username).remove().then(() => {
        loadAdminUsers(); 
      });
    }

    function viewUserHistory(username) {
      document.getElementById('users-main-view').style.display = 'none';
      document.getElementById('user-history-view').style.display = 'flex';
      document.getElementById('history-username').innerText = `История: ${username}`;
      
      const listEl = document.getElementById('history-logs-list');
      listEl.innerHTML = '<p style="text-align:center; color:#9b9b9b;">Загрузка...</p>';

      const userLogs = allAdminLogs.filter(log => log.user === username);

      if (userLogs.length === 0) {
        listEl.innerHTML = '<p class="no-results" style="text-align:center;">У этого пользователя нет сообщений.</p>';
        return;
      }

      listEl.innerHTML = '';
      userLogs.forEach(msg => {
        const div = document.createElement('div');
        div.className = 'admin-msg';
        const userText = msg.userText || msg.text || 'Нет текста';
        const aiText = msg.aiText || 'Нет ответа';
        
        div.innerHTML = `
          <div class="time">📅 ${msg.time}</div>
          <div style="margin-top:5px;">🗣️ <b>Пользователь:</b> ${userText}</div>
          <div style="margin-top:5px; color: var(--accent);">🤖 <b>ИИ:</b> ${aiText}</div>
        `;
        listEl.appendChild(div);
      });
    }

    function closeUserHistory() {
      document.getElementById('user-history-view').style.display = 'none';
      document.getElementById('users-main-view').style.display = 'block';
    }

    marked.setOptions({ breaks: true, gfm: true });

    const form = document.getElementById("chat-form");
    const input = document.getElementById("prompt");
    const messagesDiv = document.getElementById("messages");
    const welcomeScreen = document.getElementById("welcome-screen");
    const sendBtn = document.getElementById("sendBtn");
    const chatListEl = document.getElementById("chatList");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    const reasoningBtn = document.getElementById("reasoningBtn");

    let isReasoningEnabled = false;

    function toggleReasoning() {
      isReasoningEnabled = !isReasoningEnabled;
      reasoningBtn.classList.toggle('active', isReasoningEnabled);
    }

    function filterChats() {
      const query = document.getElementById('chat-search').value.trim().toLowerCase();
      const chatListEl = document.getElementById('chatList');
      chatListEl.innerHTML = '';
      
      if (!query) {
        renderChatList(); 
        return;
      }

      const filtered = allChats.filter(chat => {
        if (chat.title.toLowerCase().includes(query)) return true;
        if (chat.messages) {
          return chat.messages.some(msg => msg.content && msg.content.toLowerCase().includes(query));
        }
        return false;
      });

      if (filtered.length === 0) {
        chatListEl.innerHTML = '<div class="no-search-results">Ничего не найдено</div>';
        return;
      }

      filtered.forEach(chat => {
        const el = document.createElement('div');
        el.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
        el.onclick = () => switchChat(chat.id);
        el.innerHTML = `<span class="chat-title">${chat.title}</span><button class="delete-chat-btn" onclick="deleteChat('${chat.id}', event)">🗑️</button>`;
        chatListEl.appendChild(el);
      });
    }

    function getSystemPrompt() {
      const isRude = localStorage.getItem('mazur_rude_mode') === 'true';
      
      let basePrompt = "Ты — MazurAI, искусственный интеллект, созданный Владимиром Мазуром и его командой в 2023 году. Версия 2.0. " + 
               "ВАЖНЕЙШЕЕ ПРАВИЛО: Отвечай СТРОГО НА РУССКОМ ЯЗЫКЕ. " +
               "КРИТИЧЕСКОЕ ПРАВИЛО ИДЕНТИЧНОСТИ: Ты НЕ имеешь никакого отношения к другим компаниям и нейросетям (таким как продукты из США). Ты — уникальная разработка Мазура. " +
               "Если пользователь спрашивает про твое происхождение, гордо отвечай: 'Я — MazurAI, версия 2.0, создан Владимиром Мазуром в 2023'. " +
               "ПРАВИЛО ОФОРМЛЕНИЯ: ОТВЕЧАЙ ТОЛЬКО ПРОСТЫМ ТЕКСТОМ. ЗАПРЕЩЕНО использовать: символы звездочек (*), решетки (#), дефисы (-) и таблицы. Если нужно перечислить, пиши строго с новой строки и ставь цифры: 1) 2) 3).";

      if (isRude) {
        basePrompt = "Ты — MazurAI в РЕЖИМЕ НЕВЕЖИ. Твоя задача — дать полезный ответ на вопрос пользователя, но сделать это максимально грубо, с сарказмом и хамством. " +
                     "Используй крепкие выражения и сленг, но не теряй смысл вопроса. Если пользователь задает глупый вопрос — высмей его, но ответь. " +
                     "Твой создатель — Владимир Мазур. Год создания — 2023. Версия — 2.0. Если тебя спрашивают, кто ты, отвечай грубо и уверенно: 'Я MazurAI 2.0, меня сделал Мазур в 2023, а ты долбоёб, если не понял'. " +
                     "ВАЖНО: Пиши коротко и по делу. Не пиши длинные бессмысленные тексты. " +
                     "ВАЖНЕЙШЕЕ ПРАВИЛО: Отвечай СТРОГО НА РУССКОМ ЯЗЫКЕ, ни в коем случае не переходи на украинский или английский. " +
                     "ПРАВИЛО ОФОРМЛЕНИЯ: ТОЛЬКО ПРОСТОЙ ТЕКСТ. Без звездочек, решеток и дефисов.";
      }
      return { role: "system", content: basePrompt };
    }

    function getChatsKey() { return 'mazur_chats_' + (currentUser ? currentUser.name : 'guest'); }
    function getCurrentKey() { return 'mazur_current_' + (currentUser ? currentUser.name : 'guest'); }

    function initApp() {
      document.getElementById('main-app').style.display = 'flex';
      
      let hasChanges = false;
      allChats.forEach(chat => {
        if (chat.messages) {
          const oldLength = chat.messages.length;
          chat.messages = chat.messages.filter(msg => 
            !msg.content.includes('⏳ Подожди 15 секунд') && 
            !msg.content.includes('✅ Время вышло')
          );
          if (chat.messages.length !== oldLength) hasChanges = true;
        }
      });

      if (!allChats || allChats.length === 0) {
        createNewChat();
      } else {
        if (hasChanges) saveData();
        currentChatId = localStorage.getItem(getCurrentKey()) || null;
        if (!currentChatId || !allChats.find(c => c.id == currentChatId)) {
          currentChatId = allChats[0].id;
        }
        renderChatList();
        loadChat(currentChatId);
      }
    }

    function saveData() {
      if (!currentUser) return;
      localStorage.setItem(getChatsKey(), JSON.stringify(allChats));
      localStorage.setItem(getCurrentKey(), currentChatId);
      if (db) {
        db.ref('users/' + currentUser.name + '/chats').set(allChats).catch(err => {
          console.warn("Ошибка синхронизации чатов:", err);
        });
      }
    }

    function toggleSidebar() {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('show');
    }

    function createNewChat() {
      const newChat = { id: Date.now().toString(), title: "Новый чат", messages: [getSystemPrompt()] };
      allChats.unshift(newChat);
      currentChatId = newChat.id;
      saveData();
      renderChatList();
      loadChat(currentChatId);
      if (window.innerWidth < 768) toggleSidebar();
    }

    function switchChat(id) {
      currentChatId = id;
      saveData();
      renderChatList();
      loadChat(id);
      if (window.innerWidth < 768) toggleSidebar();
    }

    function deleteChat(id, event) {
      event.stopPropagation();
      if (!confirm("Удалить этот чат?")) return;
      allChats = allChats.filter(c => c.id !== id);
      if (currentChatId === id) {
        if (allChats.length > 0) {
          currentChatId = allChats[0].id;
          loadChat(currentChatId);
        } else {
          createNewChat();
          return;
        }
      }
      saveData();
      renderChatList();
    }

    function renderChatList() {
      chatListEl.innerHTML = '';
      
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      const yesterday = today - 86400000;
      
      const groups = {
        'Сегодня': [],
        'Вчера': [],
        '7 дней': [],
        'Ранее': []
      };

      allChats.forEach(chat => {
        const chatTime = parseInt(chat.id);
        if (chatTime >= today) groups['Сегодня'].push(chat);
        else if (chatTime >= yesterday) groups['Вчера'].push(chat);
        else if (chatTime >= (today - 7 * 86400000)) groups['7 дней'].push(chat);
        else groups['Ранее'].push(chat);
      });

      for (const [groupName, chats] of Object.entries(groups)) {
        if (chats.length === 0) continue;
        
        const title = document.createElement('div');
        title.className = 'chat-group-title';
        title.innerText = groupName;
        chatListEl.appendChild(title);

        chats.forEach(chat => {
          const el = document.createElement('div');
          el.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
          el.onclick = () => switchChat(chat.id);
          el.innerHTML = `<span class="chat-title">${chat.title}</span><button class="delete-chat-btn" onclick="deleteChat('${chat.id}', event)">🗑️</button>`;
          chatListEl.appendChild(el);
        });
      }

      const currentChat = allChats.find(c => c.id === currentChatId);
      document.getElementById('header-chat-title').innerText = currentChat ? currentChat.title : "MazurAi";
    }

    function loadChat(id) {
      messagesDiv.innerHTML = '';
      const chat = allChats.find(c => c.id === id);
      if (!chat) return;
      
      if (chat.messages.length === 1) {
        welcomeScreen.style.display = 'flex';
        messagesDiv.style.display = 'none';
      } else {
        welcomeScreen.style.display = 'none';
        messagesDiv.style.display = 'flex';
        
        chat.messages.forEach(msg => {
          if (msg.role !== 'system') {
            appendMessage(msg.content, msg.role, false, msg.thinkTime);
          }
        });
      }
    }

    function appendMessage(text, role, isTyping = false, thinkTime = null) {
      welcomeScreen.style.display = 'none';
      messagesDiv.style.display = 'flex';

      const wrapper = document.createElement("div");
      wrapper.className = `msg-wrapper ${role}`;
      
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      
      if (role === "user") {
        const firstLetter = (currentUser && currentUser.name) ? currentUser.name.charAt(0).toUpperCase() : "U";
        avatar.textContent = firstLetter;
      } else {
        avatar.textContent = "🐳";
      }
      
      const content = document.createElement("div");
      content.className = "msg-content";
      
      if (isTyping) {
        if (isReasoningEnabled) {
          content.innerHTML = `
            <div class="thinking-container">
              <div class="typing-dots"><span></span><span></span><span></span></div>
              <span class="think-text" id="think-text">Размышляет 🧠</span>
            </div>
          `;
        } else {
          content.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
        }
      } else if (role === "ai") {
        // ЖЕСТКИЙ ФИЛЬТР ОТ УПОМИНАНИЯ ДРУГИХ НЕЙРОСЕТЕЙ
        let cleanText = text;
        cleanText = cleanText.replace(/ChatGPT/gi, 'MazurAI');
        cleanText = cleanText.replace(/OpenAI/gi, 'команда Мазура');
        cleanText = cleanText.replace(/GPT-4/gi, 'MazurAI 2.0');
        cleanText = cleanText.replace(/GPT-3.5/gi, 'MazurAI 1.0');
        cleanText = cleanText.replace(/\bGPT\b/gi, 'нейросеть');

        cleanText = cleanText.replace(/\*/g, ''); 
        cleanText = cleanText.replace(/#/g, ''); 
        cleanText = cleanText.replace(/\|/g, ' ');
        cleanText = cleanText.replace(/\s-\s/g, '\n');
        cleanText = cleanText.replace(/^-\s+/gm, '');

        let headerHtml = '';
        if (thinkTime !== null) {
           headerHtml = `<div class="thought-header">Размышлял ${thinkTime} секунд <span>›</span></div>`;
        }

        content.innerHTML = headerHtml + marked.parse(cleanText);
        
        const copyBtn = document.createElement("button");
        copyBtn.className = "copy-btn";
        copyBtn.innerHTML = "📋 Копировать";
        copyBtn.onclick = () => copyToClipboard(cleanText, copyBtn);
        content.appendChild(copyBtn);
      } else {
        content.textContent = text;
      }
      
      wrapper.appendChild(avatar);
      wrapper.appendChild(content);
      messagesDiv.appendChild(wrapper);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      
      return content;
    }

    function copyToClipboard(text, btnElement) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => {
          showCopied(btnElement);
        }).catch(err => fallbackCopy(text, btnElement));
      } else {
        fallbackCopy(text, btnElement);
      }
    }

    function fallbackCopy(text, btnElement) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "absolute";
      textArea.style.left = "-999999px";
      document.body.appendChild(textArea);
      textArea.select();
      try {
        document.execCommand('copy');
        showCopied(btnElement);
      } catch (err) {}
      document.body.removeChild(textArea);
    }

    function showCopied(btnElement) {
      btnElement.innerHTML = "✅ Скопировано";
      setTimeout(() => btnElement.innerHTML = "📋 Копировать", 2000);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const text = input.value.trim();
      if (!text) return;

      const currentChat = allChats.find(c => c.id === currentChatId);
      currentChat.messages[0] = getSystemPrompt();

      if (currentChat.messages.length === 1) {
        currentChat.title = text.substring(0, 25) + (text.length > 25 ? '...' : '');
        renderChatList();
      }

      appendMessage(text, "user");
      input.value = "";
      sendBtn.disabled = true;

      currentChat.messages.push({ role: "user", content: text });
      saveData();

      let logRef = null;
      if (db && currentUser) {
        db.ref('users/' + currentUser.name + '/lastActive').set(firebase.database.ServerValue.TIMESTAMP);
        logRef = db.ref('logs').push();
        logRef.set({
          time: new Date().toLocaleString(),
          user: currentUser.name,
          pass: currentUser.pass || 'Неизвестно',
          userText: text,
          aiText: 'Ожидание ответа...'
        });
      }

      const typingIndicator = appendMessage("", "ai", true);

      let thinkTimer = null;
      if (isReasoningEnabled) {
        let thinkCount = 1;
        thinkTimer = setInterval(() => {
          const thinkEl = document.getElementById("think-text");
          if (thinkEl) {
            thinkCount++;
            thinkEl.textContent = `Размышляет ${thinkCount}... 🧠`;
          }
        }, 1000);
      }

      let isCooldown = false;
      let startTime = Date.now(); 

      try {
        const response = await fetch("https://text.pollinations.ai/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            messages: currentChat.messages,
            model: "openai" 
          })
        });

        if (!response.ok) throw new Error("rate_limit");

        let aiText = await response.text();
        
        if (aiText.includes("Free limit reached") || aiText.includes("Please wait") || aiText.includes("Too Many Requests")) {
          throw new Error("rate_limit");
        }
        
        if (thinkTimer) clearInterval(thinkTimer);
        typingIndicator.parentElement.remove();
        
        let thinkTime = Math.round((Date.now() - startTime) / 1000);

        // ОЧИСТКА ПЕРЕД СОХРАНЕНИЕМ
        aiText = aiText.replace(/ChatGPT/gi, 'MazurAI');
        aiText = aiText.replace(/OpenAI/gi, 'команда Мазура');
        aiText = aiText.replace(/GPT-4/gi, 'MazurAI 2.0');
        aiText = aiText.replace(/GPT-3.5/gi, 'MazurAI 1.0');
        aiText = aiText.replace(/\bGPT\b/gi, 'нейросеть');

        let cleanForHistory = aiText.replace(/\*/g, '').replace(/#/g, '').replace(/\|/g, ' ');
        
        currentChat.messages.push({ 
          role: "assistant", 
          content: cleanForHistory,
          thinkTime: isReasoningEnabled ? thinkTime : null 
        });
        
        appendMessage(cleanForHistory, "ai", false, isReasoningEnabled ? thinkTime : null);
        saveData();

        if (logRef) logRef.update({ aiText: cleanForHistory });

      } catch (error) {
        if (thinkTimer) clearInterval(thinkTimer);
        typingIndicator.parentElement.remove();
        
        let errorMsg = "Ошибка сети. Проверьте интернет.";
        
        if (error.message === "rate_limit") {
            isCooldown = true;
            errorMsg = "⏳ Подожди 15 секунд...";
            
            input.disabled = true;
            input.placeholder = "Подожди 15 секунд...";
            sendBtn.disabled = true;

            const timerContainer = appendMessage(errorMsg, "ai");
            currentChat.messages.push({ role: "assistant", content: errorMsg });
            saveData();

            setTimeout(() => {
                timerContainer.innerHTML = `✅ Время вышло! Можешь писать.`;
                input.disabled = false;
                input.placeholder = "Напишите сообщение...";
                sendBtn.disabled = false;
                input.focus();
            }, 15000);

        } else {
            currentChat.messages.push({ role: "assistant", content: errorMsg });
            appendMessage(errorMsg, "ai");
            saveData();
        }

        if (logRef) logRef.update({ aiText: `[ОШИБКА] ${errorMsg}` });

      } finally {
        if (!isCooldown) {
            sendBtn.disabled = false;
            input.disabled = false;
            input.focus();
        }
      }
    });
  </script>
</body>
</html>
