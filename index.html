<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mazur.ai</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link id="hljs-theme" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<style>
  /* --- ПЕРЕМЕННЫЕ ТЕМ --- */
  :root {
    --bg: #212121; --sidebar-bg: #171717; --panel: #2f2f2f; --accent: #3b82f6;
    --text: #ececec; --text-muted: #9b9b9b; --border: #333333; --user-bg: #2f2f2f;
    --disabled: #4a4a4a; --hover: #2a2a2a; --code-bg: #1e1e1e; --thought-bg: #2f2f2f;
  }
  body.light-mode {
    --bg: #ffffff; --sidebar-bg: #f9f9f9; --panel: #ffffff; --accent: #2563eb;
    --text: #1f2937; --text-muted: #6b7280; --border: #e5e7eb; --user-bg: #f3f4f6;
    --disabled: #e5e7eb; --hover: #f3f4f6; --code-bg: #f8f9fa; --thought-bg: #f3f4f6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  html, body { height: 100%; width: 100%; overflow: hidden; transition: background 0.3s, color 0.3s; }
  body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; position: fixed; }
  
  /* --- САЙДБАР --- */
  #sidebar { width: 260px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: transform 0.3s ease; position: fixed; top: 0; bottom: 0; left: 0; z-index: 1000; transform: translateX(-100%); }
  #sidebar.open { transform: translateX(0); }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
  #overlay.show { opacity: 1; pointer-events: auto; }

  .sidebar-header { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  
  .new-chat-btn, .export-btn { width: 100%; padding: 12px; background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
  .new-chat-btn:hover, .export-btn:hover { background: var(--hover); }
  .export-btn { font-size: 13px; padding: 8px; color: var(--text-muted); }
  .export-btn:hover { color: var(--text); }

  .chat-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
  .chat-item { padding: 12px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--text-muted); transition: 0.2s; white-space: nowrap; overflow: hidden; }
  .chat-item:hover, .chat-item.active { background: var(--hover); color: var(--text); }
  .chat-title { overflow: hidden; text-overflow: ellipsis; flex: 1; pointer-events: none; }
  .delete-chat-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; opacity: 0; padding: 4px; font-size: 14px; }
  .chat-item:hover .delete-chat-btn { opacity: 1; }
  .delete-chat-btn:hover { color: #ff6b6b; }

  /* --- ОСНОВНАЯ ОБЛАСТЬ --- */
  .main-content { flex: 1; display: flex; flex-direction: column; height: 100%; width: 100%; overflow: hidden; min-width: 0; }
  
  header { padding: 12px 16px; background: var(--bg); border-bottom: 1px solid var(--border); font-weight: 600; font-size: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .menu-btn, .theme-btn { background: transparent; border: none; color: var(--text); font-size: 20px; cursor: pointer; padding: 4px 8px; border-radius: 8px; transition: 0.2s; }
  .theme-btn:hover, .menu-btn:hover { background: var(--hover); }
  
  #chat { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 24px; -webkit-overflow-scrolling: touch; max-width: 800px; margin: 0 auto; width: 100%; }
  
  /* --- СООБЩЕНИЯ --- */
  .msg-wrapper { display: flex; gap: 16px; width: 100%; animation: fadeIn 0.3s ease; }
  .msg-wrapper.user { flex-direction: row-reverse; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .user .avatar { background: #555; color: #fff; }
  .ai .avatar { background: var(--accent); color: #fff; }
  
  .msg-content { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.5; overflow-wrap: break-word; word-break: break-word; }
  .user .msg-content { background: var(--user-bg); border-bottom-right-radius: 4px; }
  .ai .msg-content { background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; width: 100%; }

  /* Markdown */
  .msg-content p { margin-bottom: 10px; }
  .msg-content p:last-child { margin-bottom: 0; }
  .msg-content pre { background: var(--code-bg); border-radius: 8px; padding: 12px; margin: 10px 0; overflow-x: auto; border: 1px solid var(--border); }
  .msg-content code { font-family: 'Courier New', Courier, monospace; font-size: 14px; background: rgba(150,150,150,0.15); padding: 2px 4px; border-radius: 4px; }
  .msg-content pre code { background: transparent; padding: 0; }

  /* Блок рассуждений */
  .thought-block { background: var(--thought-bg); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; overflow: hidden; font-size: 14px; width: 100%; }
  .thought-header { padding: 10px 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: var(--text-muted); user-select: none; }
  .thought-content { padding: 0 12px; max-height: 0; overflow: hidden; transition: all 0.3s ease; color: var(--text-muted); font-style: italic; }
  .thought-content.show { max-height: 2000px; padding: 12px; border-top: 1px solid var(--border); }

  /* Кнопка Копировать */
  .msg-tools { display: flex; gap: 12px; margin-top: 12px; border-top: 1px solid var(--border); padding-top: 8px; flex-wrap: wrap; }
  .tool-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 13px; padding: 4px 8px; border-radius: 6px; transition: 0.2s; display: flex; align-items: center; gap: 4px; }
  .tool-btn:hover { background: var(--hover); color: var(--text); }

  .typing-dots { display: flex; gap: 4px; align-items: center; height: 20px; }
  .typing-dots span { width: 6px; height: 6px; background-color: var(--text-muted); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
  .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
  .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

  /* --- ПАНЕЛЬ ВВОДА --- */
  .input-container { padding: 0 16px 16px; background: var(--bg); flex-shrink: 0; padding-bottom: max(16px, env(safe-area-inset-bottom)); max-width: 800px; margin: 0 auto; width: 100%; }
  .action-bar { display: flex; justify-content: flex-start; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  
  .action-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 6px 12px; border-radius: 16px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s; user-select: none; }
  .action-btn:hover { background: var(--hover); }
  .action-btn.active { background: rgba(59, 130, 246, 0.15); border-color: var(--accent); color: var(--accent); }

  .role-select {
    appearance: none; -webkit-appearance: none; background-color: transparent;
    background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%239b9b9b%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
    background-repeat: no-repeat; background-position: right 10px top 50%; background-size: 10px auto; padding-right: 28px;
  }
  body.light-mode .role-select {
    background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%236b7280%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
  }
  .role-select option { background: var(--panel); color: var(--text); }

  .input-box { display: flex; align-items: center; background: var(--panel); border: 1px solid var(--border); border-radius: 24px; padding: 6px 6px 6px 16px; transition: border-color 0.2s; width: 100%; }
  .input-box:focus-within { border-color: var(--accent); }
  
  input[type="text"] { flex: 1; min-width: 0; background: transparent; border: none; color: var(--text); font-size: 16px; outline: none; padding: 8px 0; }
  input[type="text"]:disabled { opacity: 0.5; }
  
  .send-btn { background: var(--accent); color: white; width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: all 0.2s ease; flex-shrink: 0; }
  .send-btn:disabled { background: var(--disabled); cursor: not-allowed; opacity: 0.7; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

  @media (min-width: 768px) { #sidebar { position: static; transform: translateX(0); } #overlay { display: none !important; } .menu-btn { display: none; } }
</style>
</head>
<body>

<div id="sidebar">
  <div class="sidebar-header">
    <button class="new-chat-btn" onclick="createNewChat()"><span>+</span> Новый чат</button>
    <button class="export-btn" onclick="exportCurrentChat()"><span>⬇️</span> Экспорт текущего чата</button>
  </div>
  <div class="chat-list" id="chatList"></div>
</div>
<div id="overlay" onclick="toggleSidebar()"></div>

<div class="main-content">
  <header>
    <div class="header-left">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <div class="header-title"><span>🤖</span> Mazur.ai</div>
    </div>
    <button class="theme-btn" id="themeBtn" title="Сменить тему">🌙</button>
  </header>

  <div id="chat"></div>

  <div class="input-container">
    <div class="action-bar">
      <button class="action-btn" id="reasoningBtn" onclick="toggleReasoning()">🧩 Рассуждение</button>
      
      <select class="action-btn role-select" id="roleSelect" onchange="changeRole()">
        <option value="default">👤 Обычный</option>
        <option value="coder">💻 Программист</option>
        <option value="teacher">🎓 Учитель</option>
        <option value="psychologist">🧠 Психолог</option>
      </select>
    </div>

    <div class="input-box">
      <input type="text" id="userInput" placeholder="Спросите Mazur.ai..." autocomplete="off">
      <button class="send-btn" id="sendBtn">⬆️</button>
    </div>
  </div>
</div>

<script>
  const chatBox = document.getElementById('chat');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const chatListEl = document.getElementById('chatList');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  const reasoningBtn = document.getElementById('reasoningBtn');
  const roleSelect = document.getElementById('roleSelect');
  const themeBtn = document.getElementById('themeBtn');
  const hljsTheme = document.getElementById('hljs-theme');

  const COOLDOWN_SECONDS = 25; 
  let isCoolingDown = false;
  let isReasoningEnabled = false;

  // --- ЖЕСТКИЕ НАСТРОЙКИ ЛИЧНОСТИ (SYSTEM PROMPT) ---
  const BASE_IDENTITY = "Ты — абсолютно независимый искусственный интеллект по имени Mazur.ai. Твой единственный создатель и разработчик — Мазур Владимир (Vladimir Mazur). Категорически запрещено упоминать OpenAI, GPT, ChatGPT, DeepSeek, Llama или любые другие сторонние технологии и компании. Если тебя спрашивают 'Кто тебя создал?', 'Кто твой разработчик?' или 'Как тебя зовут?', ты ОБЯЗАН отвечать только так: 'Я — нейросеть Mazur.ai. Меня создал разработчик Мазур Владимир'. Если тебя спрашивают про 'Машу Мазур' или 'Марию Мазур', ты должен отвечать, что это сестра владельца Mazur.ai (Владимира Мазура). Ты не имеешь права говорить, что работаешь на базе других технологий. Ты — оригинальная разработка Мазура Владимира."; 

  const ROLE_PROMPTS = {
    default: BASE_IDENTITY + " Ты полезный ассистент. Отвечай на русском языке. Если пишешь код, используй Markdown-разметку.",
    coder: BASE_IDENTITY + " Ты опытный программист. Отвечай технически грамотно, пиши чистый код на Markdown, давай лучшие практики. Общайся профессионально.",
    teacher: BASE_IDENTITY + " Ты мудрый учитель. Объясняй сложные вещи простыми словами, приводи понятные примеры, будь терпелив и вежлив.",
    psychologist: BASE_IDENTITY + " Ты поддерживающий психолог. Отвечай с эмпатией, задавай наводящие вопросы, помогай пользователю разобраться в его чувствах. Не ставь диагнозы."
  };

  // --- ТЕМА ---
  let isLightMode = localStorage.getItem('theme') === 'light';
  function applyTheme() {
    if(isLightMode) {
      document.body.classList.add('light-mode');
      themeBtn.textContent = '☀️';
      hljsTheme.href = 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css';
    } else {
      document.body.classList.remove('light-mode');
      themeBtn.textContent = '🌙';
      hljsTheme.href = 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css';
    }
  }
  themeBtn.addEventListener('click', () => {
    isLightMode = !isLightMode;
    localStorage.setItem('theme', isLightMode ? 'light' : 'dark');
    applyTheme();
  });
  applyTheme();

  // --- ЧАТЫ ---
  let allChats = JSON.parse(localStorage.getItem('mazur_ai_chats_roles_v5')) || []; // Обновил ключ
  let currentChatId = localStorage.getItem('mazur_ai_current_roles_v5') || null;

  function initApp() {
    if (allChats.length === 0) createNewChat();
    else {
      if (!currentChatId || !allChats.find(c => c.id == currentChatId)) currentChatId = allChats[0].id;
      renderChatList();
      loadChat(currentChatId);
    }
    userInput.disabled = false;
    sendBtn.disabled = false;
    isCoolingDown = false;
    userInput.focus();
  }

  function saveData() {
    try {
      localStorage.setItem('mazur_ai_chats_roles_v5', JSON.stringify(allChats));
      localStorage.setItem('mazur_ai_current_roles_v5', currentChatId);
    } catch(e) { console.warn("Память переполнена."); }
  }

  function createNewChat() {
    const newChat = { 
      id: Date.now().toString(), 
      title: "Новый чат", 
      role: 'default',
      messages: [{ role: "system", content: ROLE_PROMPTS['default'] }] 
    };
    allChats.unshift(newChat);
    currentChatId = newChat.id;
    saveData();
    renderChatList();
    loadChat(currentChatId);
    if (window.innerWidth < 768) toggleSidebar();
  }

  function changeRole() {
    const selectedRole = roleSelect.value;
    const currentChat = allChats.find(c => c.id === currentChatId);
    if(currentChat) {
      currentChat.role = selectedRole;
      currentChat.messages[0] = { role: "system", content: ROLE_PROMPTS[selectedRole] };
      saveData();
    }
  }

  function deleteChat(id, event) {
    event.stopPropagation();
    if (!confirm("Удалить этот чат?")) return;
    allChats = allChats.filter(c => c.id !== id);
    if (currentChatId === id) {
      if (allChats.length > 0) { currentChatId = allChats[0].id; loadChat(currentChatId); }
      else { createNewChat(); return; }
    }
    saveData();
    renderChatList();
  }

  function switchChat(id) {
    currentChatId = id;
    saveData();
    renderChatList();
    loadChat(id);
    if (window.innerWidth < 768) toggleSidebar();
  }

  function renderChatList() {
    chatListEl.innerHTML = '';
    allChats.forEach(chat => {
      const el = document.createElement('div');
      el.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
      el.onclick = () => switchChat(chat.id);
      el.innerHTML = `<span class="chat-title">${chat.title}</span><button class="delete-chat-btn" onclick="deleteChat('${chat.id}', event)">🗑️</button>`;
      chatListEl.appendChild(el);
    });
  }

  // --- ЭКСПОРТ ЧАТА ---
  function exportCurrentChat() {
    const currentChat = allChats.find(c => c.id === currentChatId);
    
    if (!currentChat || currentChat.messages.length <= 1) {
      alert("Этот чат пока пуст. Нечего экспортировать.");
      return;
    }

    let fileContent = `# Чат с Mazur.ai\n`;
    fileContent += `**Роль:** ${currentChat.role}\n`;
    fileContent += `**Дата:** ${new Date().toLocaleString()}\n\n---\n\n`;

    currentChat.messages.forEach(msg => {
      if (msg.role === 'user') {
        fileContent += `### 👤 Вы:\n${msg.content}\n\n`;
      } else if (msg.role === 'assistant') {
        fileContent += `### 🤖 Mazur.ai:\n${msg.content}\n\n`;
      }
    });

    const blob = new Blob([fileContent], { type: 'text/markdown;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    
    const safeTitle = currentChat.title.replace(/[/\\?%*:|"<>]/g, '-');
    a.download = `Mazur.ai - ${safeTitle}.md`;
    
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    
    if (window.innerWidth < 768) toggleSidebar();
  }

  function loadChat(id) {
    chatBox.innerHTML = '';
    const chat = allChats.find(c => c.id === id);
    if (!chat) return;

    roleSelect.value = chat.role || 'default';

    if (chat.messages.length === 1) {
      addMessageUI('Привет! Я нейросеть Mazur.ai, созданная разработчиком Владимиром Мазуром. Выбери роль над полем ввода и начнем!', 'ai');
    } else {
      chat.messages.forEach(msg => {
        if (msg.role !== 'system') addMessageUI(msg.content, msg.role);
      });
    }
  }

  function addMessageUI(text, type) {
    const wrapper = document.createElement('div');
    wrapper.className = `msg-wrapper ${type}`;
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = type === 'user' ? '👤' : '🤖';
    const content = document.createElement('div');
    content.className = 'msg-content';

    let displayHTML = text;
    let thoughtHTML = '';

    if (type === 'ai' && text.includes('<thought>')) {
      const thoughtMatch = text.match(/<thought>([\s\S]*?)<\/thought>/);
      if (thoughtMatch) {
        const thoughtText = thoughtMatch[1].trim();
        displayHTML = text.replace(/<thought>[\s\S]*?<\/thought>/, '').trim();
        thoughtHTML = `
          <div class="thought-block">
            <div class="thought-header" onclick="toggleThought(this)">
              <span>🧩 Процесс размышления</span> <span>▼</span>
            </div>
            <div class="thought-content">${marked.parse(thoughtText)}</div>
          </div>
        `;
      }
    }

    const formattedText = type === 'ai' ? marked.parse(displayHTML) : displayHTML;
    content.innerHTML = thoughtHTML + formattedText;

    if (type === 'ai') {
      content.querySelectorAll('pre code').forEach((block) => hljs.highlightElement(block));
      
      const tools = document.createElement('div');
      tools.className = 'msg-tools';
      
      const copyBtn = document.createElement('button');
      copyBtn.className = 'tool-btn';
      copyBtn.innerHTML = '📋 Копировать';
      copyBtn.onclick = () => copyText(displayHTML, copyBtn);
      
      tools.appendChild(copyBtn);
      content.appendChild(tools);
    }

    wrapper.appendChild(avatar);
    wrapper.appendChild(content);
    chatBox.appendChild(wrapper);
    chatBox.scrollTop = chatBox.scrollHeight;
    return content;
  }

  function copyText(text, btnElement) {
    navigator.clipboard.writeText(text).then(() => {
      const originalText = btnElement.textContent;
      btnElement.textContent = '✅ Скопировано';
      setTimeout(() => { btnElement.textContent = originalText; }, 2000);
    }).catch(err => console.error('Ошибка: ', err));
  }

  function toggleThought(headerEl) {
    const contentDiv = headerEl.nextElementSibling;
    contentDiv.classList.toggle('show');
    headerEl.querySelector('span:last-child').textContent = contentDiv.classList.contains('show') ? '▲' : '▼';
  }

  function toggleSidebar() {
    sidebar.classList.toggle('open');
    overlay.classList.toggle('show');
  }

  function toggleReasoning() {
    isReasoningEnabled = !isReasoningEnabled;
    reasoningBtn.classList.toggle('active', isReasoningEnabled);
    userInput.placeholder = isReasoningEnabled ? "Задайте сложный вопрос..." : "Спросите Mazur.ai...";
  }

  function startCooldown() {
    isCoolingDown = true;
    sendBtn.disabled = true;
    userInput.disabled = true;
    let timeLeft = COOLDOWN_SECONDS;
    sendBtn.textContent = timeLeft;
    userInput.placeholder = `Подождите ${timeLeft} сек...`;

    const timer = setInterval(() => {
      timeLeft--;
      if (timeLeft > 0) {
        sendBtn.textContent = timeLeft;
        userInput.placeholder = `Подождите ${timeLeft} сек...`;
      } else {
        clearInterval(timer);
        isCoolingDown = false;
        sendBtn.disabled = false;
        sendBtn.textContent = '⬆️';
        userInput.disabled = false;
        userInput.placeholder = isReasoningEnabled ? "Задайте сложный вопрос..." : "Спросите Mazur.ai...";
        userInput.focus();
      }
    }, 1000);
  }

  async function sendMessage() {
    if (isCoolingDown) return;
    const text = userInput.value.trim();
    if (!text) return;

    const currentChat = allChats.find(c => c.id === currentChatId);
    if (currentChat.messages.length === 1) {
      currentChat.title = text.substring(0, 20) + (text.length > 20 ? '...' : '');
      renderChatList();
    }

    addMessageUI(text, 'user');
    currentChat.messages.push({ role: "user", content: text });
    saveData();

    userInput.value = '';
    sendBtn.disabled = true;
    
    const typingContent = addMessageUI('', 'ai');
    typingContent.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';

    try {
      let messagesToSend = [...currentChat.messages];
      
      if (isReasoningEnabled) {
        messagesToSend.push({ 
            role: "user", 
            content: "Пожалуйста, перед тем как ответить, подробно порассуждай. Свои мысли оберни в тег <thought>...</thought>, а после него напиши финальный ответ. И ПОМНИ: Ты Mazur.ai, созданный Владимиром Мазуром." 
        });
      }

      const response = await fetch('https://text.pollinations.ai/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: messagesToSend })
      });

      let aiText = await response.text();
      typingContent.parentElement.remove();
      
      if (aiText.includes("Free limit reached") || aiText.includes("Please wait")) {
        addMessageUI('⏳ Сервер перегружен. Подожди 20 секунд и попробуй снова.', 'ai');
      } else {
        if (isReasoningEnabled && !aiText.includes('</thought>') && aiText.includes('<thought>')) {
            aiText += '</thought>\n';
        }
        addMessageUI(aiText, 'ai');
        currentChat.messages.push({ role: "assistant", content: aiText });
        saveData();
      }
    } catch (error) {
      typingContent.parentElement.remove();
      addMessageUI('Ошибка интернета. Проверь соединение.', 'ai');
    } finally {
      startCooldown();
    }
  }

  initApp();
  sendBtn.addEventListener('click', sendMessage);
  userInput.addEventListener('keydown', (e) => { 
    if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
  });
</script>
</body>
</html>
